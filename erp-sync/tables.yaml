# Load of JES_UnitedArt. All base tables except audit/logs.
#
# Seven tables run INCREMENTAL (enabled 2026-07-21) — Item, ItemDetail,
# ItemTransaction, SalesOrder, SalesInvoice, Purchase, SalesOrderDetail. Each was
# proven to refresh LastUpdate on edit (see PROJECT-PLAN.md, "LastUpdate probe"),
# and each declared pk was verified unique with no nulls against the mirror
# before being enabled. This takes a refresh from ~5 hours to minutes.
#
# JobOrderBOM stays FULL: it is the one giant never probed.
#
# Everything else stays full. Full mode is idempotent/self-healing, so a full run
# remains the repair path — in particular for the 556 ItemTransaction rows whose
# LastUpdate is null and which incremental can never see.

defaults:
  source_schema: dbo
  target_schema: raw
  mode: full
  batch_size: 5000

