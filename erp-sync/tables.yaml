  - source: Item
    mode: incremental
    watermark: LastUpdate
    pk: [ITPK]            # ITPK is unique across all 1,447,399 rows; the earlier
                          # note suggested [ITCode, ITRevision] but ITPK is the
                          # real key and a single column.
  - source: ItemDetail
    mode: incremental
    watermark: LastUpdate
    pk: [IDPK]
  - source: JobOrderBOM
    mode: full            # NOT probed — do not assume it behaves like the others.
                          # Leave on full until LastUpdate is verified for it.
  - source: ItemTransaction
    mode: incremental
    watermark: LastUpdate
    pk: [ITPK]            # 556 rows have a NULL LastUpdate and can never be
                          # picked up incrementally. They were captured by the
                          # full pass on 2026-07-19; a future full run repairs
                          # any others.

  # ── never synced: SystemAudit (2.3GB audit), LogonLog ──
