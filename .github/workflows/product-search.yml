name: Product search regressions
on:
  push:
    paths:
      - 'src/**'
      - 'netlify/edge-functions/**'
      - 'qa/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-search.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'netlify/edge-functions/**'
      - 'qa/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-search.yml'
  workflow_dispatch:
# Regression checks need read-only repository access and no project secrets.
permissions:
  contents: read
jobs:
  product-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:product-search
      - run: npm run test:quote-pdf
      - run: npm run test:quote-excel
      - run: npm run test:invoice-units
      - run: npm run test:packing-po
      - run: npm run test:ai-writer
