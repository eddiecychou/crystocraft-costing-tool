name: Product search regressions
on:
  push:
    paths:
      - 'mcp/range/**'
      - 'mcp/figurine-range/**'
      - 'src/**'
      - 'netlify/edge-functions/**'
      - 'netlify/functions/**'
      - 'seo-control-plane/**'
      - 'qa/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-search.yml'
  pull_request:
    paths:
      - 'mcp/range/**'
      - 'mcp/figurine-range/**'
      - 'src/**'
      - 'netlify/edge-functions/**'
      - 'netlify/functions/**'
      - 'seo-control-plane/**'
      - 'qa/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-search.yml'
  workflow_dispatch:
# Regression checks need read-only repository access and no project secrets.
permissions:
  contents: read
jobs:
  product-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:design-projects
      - run: npm run test:oc-time
      - run: npm run test:customer-workspace
      - run: npm run test:product-search
      - run: npm run test:quote-pdf
      - run: npm run test:quote-excel
      - run: npm run test:invoice-units
      - run: npm run test:packing-po
      - run: npm run test:ai-writer
      - run: npm run test:catalogue-cover
      - run: npm run test:seo-control-plane
      - run: npm ci --prefix mcp/range --no-audit --no-fund
      - run: npm ci --prefix mcp/figurine-range --no-audit --no-fund
      - run: npm run test:range-mcp
  customer-merge-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Access rules, customer workflows and real-page task/note sync
        run: npx --yes firebase-tools@15.33.0 emulators:exec --only firestore,storage --project crystocraft-rbac-test "node qa/rbac-rules.test.mjs && node --test qa/customer-merge-emulator.mjs && node --test qa/customer-pipeline-emulator.mjs && node --test qa/pd-projects-emulator.mjs && npm run test:workspace-sync"
