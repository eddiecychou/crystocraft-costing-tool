<!-- @dsCard group="Type" viewport="700x300" name="Headings — Questrial" subtitle="Geometric sans, weight 400 · H1–H3 uppercase, H4 normal case" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-beige); padding: 26px 32px; }
.eyebrow { font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-bronze); margin-bottom: 18px; display: block; }
.h { font-family: 'Questrial', sans-serif; font-weight: 400; color: var(--color-near-black); line-height: 1.1; display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; }
.h1 { font-size: 36px; text-transform: uppercase; }
.h2 { font-size: 30px; text-transform: uppercase; line-height: 34px; letter-spacing: 0.89px; }
.h3 { font-size: 24px; text-transform: uppercase; }
.h4 { font-size: 20px; }
.tag { font-family: 'Work Sans', sans-serif; font-size: 9px; font-weight: 500; letter-spacing: 0.08em; color: var(--color-graphite); opacity: 0.65; text-transform: none; }
</style>
</head>
<body>
  <span class="eyebrow">Headings · Questrial</span>
  <p class="h h1">Catches the Light <span class="tag">H1 · 36 · UPPER</span></p>
  <p class="h h2">Metal and Crystal <span class="tag">H2 · 30 · UPPER</span></p>
  <p class="h h3">Made to Standard <span class="tag">H3 · 24 · UPPER</span></p>
  <p class="h h4">Crafted in-house since 1958. <span class="tag">H4 · 20 · Normal</span></p>
</body>
</html>
