<!-- @dsCard group="Colors" viewport="700x190" name="Division System" subtitle="One master brand, three audiences — the accent colour is the only thing that changes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; height: 190px; display: flex; }
.div { flex: 1; padding: 22px 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid rgba(255,255,255,0.12); }
.div:last-child { border-right: none; }
.div-desc { font-family: 'Work Sans', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
.div-name { font-family: 'Questrial', sans-serif; font-size: 22px; font-weight: 400; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.02em; }
.div-tag  { font-family: 'Work Sans', sans-serif; font-size: 9px; letter-spacing: 0.06em; margin-top: 10px; }
.div-bottom { font-family: 'Work Sans', sans-serif; font-size: 11px; line-height: 1.45; }
</style>
</head>
<body>
  <div class="div" style="background:#996632">
    <div class="div-top">
      <p class="div-desc" style="color:rgba(255,255,255,0.7)">Gifts · Flagship</p>
      <p class="div-name" style="color:#FFFFFF">Crystocraft</p>
      <p class="div-tag" style="color:rgba(255,255,255,0.7)">Bronze Gold · #996632</p>
    </div>
    <p class="div-bottom" style="color:rgba(255,255,255,0.8)">Gift buyers, collectors, wholesale.</p>
  </div>
  <div class="div" style="background:#1C4F64">
    <div class="div-top">
      <p class="div-desc" style="color:rgba(240,245,248,0.7)">Crystals</p>
      <p class="div-name" style="color:#FFFFFF">Crystocraft<br>Crystals</p>
      <p class="div-tag" style="color:rgba(240,245,248,0.6)">Sapphire · #1C4F64</p>
    </div>
    <p class="div-bottom" style="color:rgba(240,245,248,0.8)">Designers, jewellers, lighting, interiors.</p>
  </div>
  <div class="div" style="background:#6E2433">
    <div class="div-top">
      <p class="div-desc" style="color:rgba(245,240,241,0.7)">Bespoke</p>
      <p class="div-name" style="color:#FFFFFF">Crystocraft<br>Bespoke Gifting</p>
      <p class="div-tag" style="color:rgba(245,240,241,0.6)">Burgundy · #6E2433</p>
    </div>
    <p class="div-bottom" style="color:rgba(245,240,241,0.8)">Corporate, marketing, procurement.</p>
  </div>
</body>
</html>
