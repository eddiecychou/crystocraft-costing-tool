<!-- @dsCard group="Spacing" viewport="700x175" name="Spacing Scale" subtitle="4 px base grid — --space-1 through --space-24" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); padding: 24px 28px 20px; }
.grid { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 8px; }
.bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.bar { background: var(--color-ink); }
.lbl { font-family: 'Work Sans', sans-serif; font-size: 9px; color: var(--color-graphite); letter-spacing: 0.05em; white-space: nowrap; }
.px  { font-family: 'Work Sans', sans-serif; font-size: 8px; color: var(--color-platinum); }
</style>
</head>
<body>
<div class="grid">
  <div class="bar-wrap"><div class="bar" style="width:8px;height:4px"></div><span class="lbl">1</span><span class="px">4</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:8px"></div><span class="lbl">2</span><span class="px">8</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:12px"></div><span class="lbl">3</span><span class="px">12</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:16px"></div><span class="lbl">4</span><span class="px">16</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:20px"></div><span class="lbl">5</span><span class="px">20</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:24px"></div><span class="lbl">6</span><span class="px">24</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:32px"></div><span class="lbl">8</span><span class="px">32</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:40px"></div><span class="lbl">10</span><span class="px">40</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:48px"></div><span class="lbl">12</span><span class="px">48</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:64px"></div><span class="lbl">16</span><span class="px">64</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:80px"></div><span class="lbl">20</span><span class="px">80</span></div>
  <div class="bar-wrap"><div class="bar" style="width:8px;height:96px"></div><span class="lbl">24</span><span class="px">96</span></div>
  <div class="bar-wrap" style="margin-left:8px"><div class="bar" style="width:8px;height:128px;opacity:0.35"></div><span class="lbl">32</span><span class="px">128</span></div>
</div>
</body>
</html>
