<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-beige); padding: 22px 32px; display: flex; flex-direction: column; gap: 14px; }
.eb { font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
.gifts    { color: var(--color-bronze); }
.crystals { color: var(--color-crystals); }
.bespoke  { color: var(--color-bespoke); }
.row { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
  <p class="eb gifts">Craftsmanship that catches the light · Since 1958</p>
  <div class="row">
    <span class="eb gifts">Crystocraft — Gifts</span>
    <span class="eb crystals">Crystocraft Crystals</span>
    <span class="eb bespoke">Bespoke Gifting</span>
    <span class="eb gifts" style="font-size:10px">Est. 1958 · Dazzle Cut · 32 Facets</span>
  </div>
</body>
</html>
