<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-display)}
.main{flex:1;background:#996632;display:flex;align-items:center;justify-content:center;padding:0 60px}
.wordmark{color:#F7EEE3;font-size:150px;text-transform:uppercase;letter-spacing:0.02em;line-height:1;white-space:nowrap}
.strip{width:120px;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="main"><span class="wordmark">Crystocraft</span></div>
<div class="strip">
  <div style="background:#F0F5F8"></div>
  <div style="background:#C6A664"></div>
  <div style="background:#1C4F64"></div>
  <div style="background:#6E2433"></div>
</div>
</body>
</html>
