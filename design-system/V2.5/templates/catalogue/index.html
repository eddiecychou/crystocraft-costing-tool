<!-- @template name="Product Catalogue" description="Crystocraft Gifts product catalogue — filterable grid with product detail overlay" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystocraft Gifts — Collection Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-ivory); color: var(--color-ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-ivory); border-bottom: 1px solid var(--color-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 56px; height: 68px;
}
.nav-logo { height: 32px; mix-blend-mode: multiply; }
.nav-links { display: flex; gap: 32px; }
.nav-link { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-graphite); cursor: pointer; border: none; background: none; transition: color 0.15s; }
.nav-link:hover, .nav-link.active { color: var(--color-ink); }
.nav-right { display: flex; gap: 14px; align-items: center; }

/* Catalogue header */
.cat-header { padding: 48px 56px 0; display: flex; align-items: flex-end; justify-content: space-between; }
.cat-header-left {}
.cat-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--color-graphite); margin-bottom: 8px; }
.cat-title { font-family: var(--font-serif); font-size: 38px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: var(--color-ink); line-height: 1.1; }
.cat-count { font-size: 12px; color: var(--color-graphite); }

/* Sort row */
.sort-row { padding: 20px 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--color-border); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.sort-select { font-family: var(--font-sans); font-size: 12px; color: var(--color-graphite); background: transparent; border: none; outline: none; cursor: pointer; letter-spacing: 0.06em; }

/* Product grid */
.product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--color-border); padding: 1px 56px; margin-top: 1px; }
.tile { background: var(--color-white); cursor: pointer; transition: box-shadow 0.2s; position: relative; }
.tile:hover { box-shadow: var(--shadow-lg); z-index: 1; }
.tile:hover .tile-img-inner { transform: scale(1.04); }
.tile-img { aspect-ratio: 1; overflow: hidden; background: var(--color-ink); position: relative; }
.tile-img-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transition: transform 0.4s ease; }
.tile-mark { width: 52px; height: 52px; opacity: 0.10; filter: invert(1); }
.tile-badge { position: absolute; top: 12px; left: 12px; }
.tile-body { padding: 14px 16px 18px; }
.tile-cat { font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-graphite); margin-bottom: 5px; }
.tile-name { font-family: var(--font-serif); font-size: 17px; font-weight: 400; line-height: 1.25; margin-bottom: 4px; color: var(--color-ink); }
.tile-desc { font-size: 12px; color: var(--color-graphite); line-height: 1.5; margin-bottom: 10px; }
.tile-footer { display: flex; align-items: center; justify-content: space-between; }
.tile-price { font-size: 13px; font-weight: 500; color: var(--color-ink); letter-spacing: 0.04em; }
.tile-action { font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-graphite); }

/* Load more */
.load-more-wrap { display: flex; justify-content: center; padding: 56px 56px; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(28,28,26,0.65); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--color-white); width: 860px; max-width: 100%; max-height: 90vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; }
.modal-img { background: var(--color-ink); display: flex; align-items: center; justify-content: center; min-height: 380px; }
.modal-img-mark { width: 80px; height: 80px; opacity: 0.12; filter: invert(1); }
.modal-body { padding: 40px 36px; display: flex; flex-direction: column; gap: 14px; }
.modal-close { position: sticky; top: 0; background: none; border: none; cursor: pointer; color: var(--color-graphite); font-size: 18px; align-self: flex-end; padding: 0 0 6px; line-height: 1; }
.modal-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-graphite); }
.modal-name { font-family: var(--font-serif); font-size: 30px; font-weight: 400; line-height: 1.15; }
.modal-desc { font-size: 14px; line-height: 1.75; color: var(--color-graphite); font-weight: 300; }
.modal-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid var(--color-border); padding-top: 14px; }
.modal-spec-label { font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-graphite); margin-bottom: 3px; }
.modal-spec-val { font-size: 13px; color: var(--color-ink); font-weight: 500; }
.modal-price-row { display: flex; align-items: baseline; gap: 12px; }
.modal-price { font-size: 22px; font-weight: 500; letter-spacing: 0.02em; }
.modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

/* Footer */
.footer { padding: 36px 56px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--color-border); background: var(--color-ivory-dark); }
.footer-logo { height: 24px; mix-blend-mode: multiply; opacity: 0.5; }
.footer-copy { font-size: 11px; color: rgba(110,108,102,0.55); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Badge, Tag } = window.CrystocraftDesignSystem_25701b || {};

const PRODUCTS = [
  { id:1,  name:'Crystal Butterfly Suncatcher', cat:'Figurines',  desc:'The original 1958 design. Hand-finished butterfly on leaded crystal. Each piece numbered.',      price:'From HK$280', badge:'Heritage',  bv:'solid-ink', bg:'#1C1C1A',  specs:{ Material:'Leaded crystal', Finish:'Clear', Origin:'Hong Kong', Collection:'Heritage 1958' } },
  { id:2,  name:'Crystal Rose',                  cat:'Florals',    desc:'Petals formed from a single hand-cut crystal. Presented in a Crystocraft gift box.',               price:'From HK$360', badge:'New',       bv:'new',       bg:'#2A2A27',  specs:{ Material:'Dazzle Cut crystal', Finish:'Clear / Rose', Origin:'Hong Kong', Collection:'Florals 2025' } },
  { id:3,  name:'Crystal Music Box',             cat:'Gifts',      desc:'Rotating crystal figurine with hand-wound mechanical 18-note movement. Mirror base.',               price:'From HK$580', badge:'Featured',  bv:'solid-gold', bg:'#1C1C1A', specs:{ Material:'Crystal + brass', Finish:'Polished silver', Origin:'Hong Kong', Collection:'Signature' } },
  { id:4,  name:'Crystal Swan',                  cat:'Figurines',  desc:'Smooth-Spin swan on a mirror base. Dazzle Cut wings catch directional light beautifully.',          price:'From HK$480', badge:'',          bv:'',          bg:'#2A2A27',  specs:{ Material:'Dazzle Cut crystal', Finish:'Clear', Origin:'Hong Kong', Collection:'Signature' } },
  { id:5,  name:'Crystal Photo Frame',           cat:'Home',       desc:'Heavyweight clear crystal frame with satin-finish silver metal inlay. Holds 4×6 inches.',           price:'From HK$320', badge:'',          bv:'',          bg:'#1C1C1A',  specs:{ Material:'Crystal + silver', Finish:'Clear / Silver', Origin:'Hong Kong', Collection:'Home 2025' } },
  { id:6,  name:'Crystal Angel',                 cat:'Figurines',  desc:'Delicate winged figure in full-lead crystal. Presented in a silk-lined Crystocraft case.',          price:'From HK$420', badge:'',          bv:'',          bg:'#2A2A27',  specs:{ Material:'Full-lead crystal', Finish:'Clear', Origin:'Hong Kong', Collection:'Signature' } },
  { id:7,  name:'Crystal Champagne Flutes',      cat:'Gift Sets',  desc:'Pair of long-stem flutes with Dazzle Cut crystal bowls and sterling silver stems.',                 price:'From HK$680', badge:'Premium',   bv:'platinum',  bg:'#1C1C1A',  specs:{ Material:'Crystal + sterling silver', Finish:'Clear', Origin:'Hong Kong', Collection:'Occasions' } },
  { id:8,  name:'Crystal Globe',                 cat:'Home',       desc:'Rotating globe in clear Dazzle Cut crystal on a brass meridian stand. A desk statement.',           price:'From HK$540', badge:'',          bv:'',          bg:'#2A2A27',  specs:{ Material:'Dazzle Cut crystal + brass', Finish:'Clear / Gold', Origin:'Hong Kong', Collection:'Home 2025' } },
  { id:9,  name:'Crystal Gift Set — Celebration',cat:'Gift Sets',  desc:'Curated presentation: two champagne flutes, two keepsakes, and a premium Crystocraft gift box.',   price:'From HK$880', badge:'',          bv:'',          bg:'#1C1C1A',  specs:{ Material:'Crystal + sterling silver', Finish:'Clear', Origin:'Hong Kong', Collection:'Gift Sets' } },
  { id:10, name:'Crystal Lily',                  cat:'Florals',    desc:'Multi-petal lily in clear crystal on a polished silver stem. Presented gift-boxed.',                price:'From HK$390', badge:'New',       bv:'new',       bg:'#2A2A27',  specs:{ Material:'Dazzle Cut crystal', Finish:'Clear', Origin:'Hong Kong', Collection:'Florals 2025' } },
  { id:11, name:'Crystal Butterfly Pair',        cat:'Figurines',  desc:'Two-butterfly suncatcher in leaded crystal, the 65th anniversary edition with gold-finish stand.', price:'From HK$640', badge:'Limited',   bv:'solid-gold', bg:'#1C1C1A', specs:{ Material:'Leaded crystal + gold', Finish:'Clear / Gold', Origin:'Hong Kong', Collection:'Heritage 1958' } },
  { id:12, name:'Crystal Lotus',                 cat:'Florals',    desc:'Eight-petal lotus in Dazzle Cut crystal on a mirror-finish brass pond base.',                       price:'From HK$460', badge:'',          bv:'',          bg:'#2A2A27',  specs:{ Material:'Dazzle Cut crystal + brass', Finish:'Clear', Origin:'Hong Kong', Collection:'Florals 2025' } },
];

const CATS = ['All', 'Figurines', 'Florals', 'Gift Sets', 'Home'];

function ProductModal({ p, onClose }) {
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-img" style={{ background: p.bg }}>
          <img src="../../assets/logos/logo-mark.png" className="modal-img-mark" alt="" />
        </div>
        <div className="modal-body">
          <button className="modal-close" onClick={onClose}>✕</button>
          {p.badge && Badge && <Badge variant={p.bv} size="xs">{p.badge}</Badge>}
          <p className="modal-eyebrow">{p.cat}</p>
          <h2 className="modal-name">{p.name}</h2>
          <p className="modal-desc">{p.desc} Presented in a Crystocraft gift box with the authentication mark and care guide.</p>
          <div className="modal-specs">
            {Object.entries(p.specs).map(([k, v]) => (
              <div key={k}>
                <p className="modal-spec-label">{k}</p>
                <p className="modal-spec-val">{v}</p>
              </div>
            ))}
          </div>
          <div className="modal-price-row"><p className="modal-price">{p.price}</p></div>
          <div className="modal-actions">
            {Button && <Button variant="primary" fullWidth>Enquire About This Piece</Button>}
            {Button && <Button variant="ghost" fullWidth>Add to Wishlist</Button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [cat, setCat] = React.useState('All');
  const [sort, setSort] = React.useState('Featured');
  const [selected, setSelected] = React.useState(null);
  const [showing, setShowing] = React.useState(8);

  const filtered = cat === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat);
  const visible = filtered.slice(0, showing);

  return (
    <div>
      <nav className="nav">
        <img src="../../assets/logos/logo-horizontal.jpg" className="nav-logo" alt="Crystocraft" />
        <div className="nav-links">
          {['Collections','Florals','Gift Sets','Heritage','Crystals','Bespoke'].map(n => (
            <button key={n} className="nav-link">{n}</button>
          ))}
        </div>
        <div className="nav-right">
          {Button && <Button variant="outline" size="sm">Trade Login</Button>}
        </div>
      </nav>

      <div className="cat-header">
        <div className="cat-header-left">
          <p className="cat-eyebrow">Catalogue · 2025</p>
          <h1 className="cat-title">Gifts Collection</h1>
        </div>
        <p className="cat-count">{filtered.length} pieces</p>
      </div>

      <div className="sort-row">
        <div className="filters">
          {CATS.map(c => (
            Tag
              ? <Tag key={c} active={cat===c} onClick={() => { setCat(c); setShowing(8); }}>{c}</Tag>
              : <button key={c} onClick={() => setCat(c)} style={{fontSize:11,padding:'5px 14px',background:cat===c?'#222222':'transparent',color:cat===c?'#F7EEE3':'#666666',border:'1px solid rgba(34,34,34,0.2)',cursor:'pointer',borderRadius:9999}}>{c}</button>
          ))}
        </div>
        <select className="sort-select" value={sort} onChange={e => setSort(e.target.value)}>
          {['Featured','Price: Low to High','Price: High to Low','New Arrivals'].map(o => <option key={o}>{o}</option>)}
        </select>
      </div>

      <div className="product-grid">
        {visible.map(p => (
          <div key={p.id} className="tile" onClick={() => setSelected(p)}>
            <div className="tile-img" style={{ background: p.bg }}>
              <div className="tile-img-inner">
                <img src="../../assets/logos/logo-mark.png" className="tile-mark" alt="" />
              </div>
              {p.badge && Badge && <div className="tile-badge"><Badge variant={p.bv} size="xs">{p.badge}</Badge></div>}
            </div>
            <div className="tile-body">
              <p className="tile-cat">{p.cat}</p>
              <p className="tile-name">{p.name}</p>
              <p className="tile-desc">{p.desc.slice(0, 72)}…</p>
              <div className="tile-footer">
                <p className="tile-price">{p.price}</p>
                <p className="tile-action">View →</p>
              </div>
            </div>
          </div>
        ))}
      </div>

      {showing < filtered.length && (
        <div className="load-more-wrap">
          {Button && <Button variant="outline" size="lg" onClick={() => setShowing(s => s + 4)}>Load more pieces</Button>}
        </div>
      )}

      <footer className="footer">
        <img src="../../assets/logos/logo-horizontal.jpg" className="footer-logo" alt="Crystocraft" />
        <p className="footer-copy">© Crystocraft 2025</p>
      </footer>

      {selected && <ProductModal p={selected} onClose={() => setSelected(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
