<!-- @dsCard group="Colors" viewport="700x130" name="Metallic Finishes" subtitle="Ink Black · Champagne Gold · Platinum — print & packaging, shared across divisions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; height: 130px; display: flex; }
.swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 14px; }
.name { font-family: 'Work Sans', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 3px; }
.hex  { font-family: 'Work Sans', sans-serif; font-size: 11px; }
.note { font-family: 'Work Sans', sans-serif; font-size: 9px; letter-spacing: 0.04em; margin-top: 2px; }
</style>
</head>
<body>
  <div class="swatch" style="background:#1C1C1A">
    <span class="name" style="color:#F7EEE3">Ink Black</span>
    <span class="hex"  style="color:rgba(247,238,227,0.6)">#1C1C1A</span>
    <span class="note" style="color:rgba(247,238,227,0.5)">Deepest dark · foil base · packaging</span>
  </div>
  <div class="swatch" style="background:#C6A664">
    <span class="name" style="color:#1C1C1A">Champagne Gold</span>
    <span class="hex"  style="color:rgba(28,28,26,0.6)">#C6A664</span>
    <span class="note" style="color:rgba(28,28,26,0.55)">Premium metallic · foil · engraving</span>
  </div>
  <div class="swatch" style="background:#C9CBCC">
    <span class="name" style="color:#1C1C1A">Platinum</span>
    <span class="hex"  style="color:rgba(28,28,26,0.6)">#C9CBCC</span>
    <span class="note" style="color:rgba(28,28,26,0.55)">Secondary metallic · borders · detail</span>
  </div>
</body>
</html>
