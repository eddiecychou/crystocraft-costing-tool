<!-- @dsCard group="Spacing" viewport="700x220" name="Radius & Shadows" subtitle="Border-radius scale · soft elevation (hairline-first — drop shadows used sparingly)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-ivory); padding: 22px 28px; }
.section { margin-bottom: 18px; }
.lbl { font-family: 'Work Sans', sans-serif; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-graphite); margin-bottom: 12px; display: block; }
.radius-row { display: flex; gap: 14px; align-items: center; }
.r { width: 40px; height: 40px; background: var(--color-ink); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
.r-lbl { font-family: 'Work Sans', sans-serif; font-size: 8px; color: rgba(247,238,227,0.7); letter-spacing: 0.06em; }
.shadow-row { display: flex; gap: 14px; align-items: center; }
.s { width: 68px; height: 44px; background: var(--color-white); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
.s-lbl { font-family: 'Work Sans', sans-serif; font-size: 8px; color: var(--color-graphite); letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="section">
    <span class="lbl">Border Radius</span>
    <div class="radius-row">
      <div><div class="r" style="border-radius:0"><span class="r-lbl">none</span></div></div>
      <div><div class="r" style="border-radius:2px"><span class="r-lbl">xs</span></div></div>
      <div><div class="r" style="border-radius:4px"><span class="r-lbl">sm</span></div></div>
      <div><div class="r" style="border-radius:6px"><span class="r-lbl">md</span></div></div>
      <div><div class="r" style="border-radius:12px"><span class="r-lbl">lg</span></div></div>
      <div><div class="r" style="border-radius:20px"><span class="r-lbl">xl</span></div></div>
      <div><div class="r" style="border-radius:9999px"><span class="r-lbl">full</span></div></div>
    </div>
  </div>
  <div class="section">
    <span class="lbl">Elevation Shadows</span>
    <div class="shadow-row">
      <div><div class="s" style="box-shadow:none"><span class="s-lbl">none</span></div></div>
      <div><div class="s" style="box-shadow:0 1px 2px rgba(34,34,34,0.04)"><span class="s-lbl">xs</span></div></div>
      <div><div class="s" style="box-shadow:0 1px 3px rgba(34,34,34,0.05)"><span class="s-lbl">sm</span></div></div>
      <div><div class="s" style="box-shadow:0 4px 14px rgba(34,34,34,0.07)"><span class="s-lbl">md</span></div></div>
      <div><div class="s" style="box-shadow:0 10px 30px rgba(34,34,34,0.09)"><span class="s-lbl">lg</span></div></div>
      <div><div class="s" style="box-shadow:0 20px 50px rgba(34,34,34,0.11)"><span class="s-lbl">xl</span></div></div>
      <div><div class="s" style="box-shadow:0 4px 20px rgba(153,102,50,0.20)"><span class="s-lbl">bronze</span></div></div>
    </div>
  </div>
</body>
</html>
