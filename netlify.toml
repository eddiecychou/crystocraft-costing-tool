[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[context.production]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

[[edge_functions]]
  function = "process-quote"
  path = "/api/process-quote"

[[edge_functions]]
  function = "download-image"
  path = "/api/download-image"

[[edge_functions]]
  function = "fx-rates"
  path = "/api/fx-rates"

[[edge_functions]]
  function = "generate-blog"
  path = "/api/generate-blog"

[[edge_functions]]
  function = "publish-to-wordpress"
  path = "/api/publish-to-wordpress"

[[edge_functions]]
  function = "image-proxy"
  path = "/api/image-proxy"

[[edge_functions]]
  function = "rewrite-section"
  path = "/api/rewrite-section"

[[edge_functions]]
  function = "generate-marketing-copy"
  path = "/api/generate-marketing-copy"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
