<!doctype html><html><head><meta charset="utf-8"><title>Shared Product Design navigation audit</title></head><body><h1>Product Design navigation — actual pages, fictional reads</h1><button id="run">Run desktop and mobile checks</button><label>Page <select id="page"><option value="/design/customers/qa/brand">Customer brand</option><option value="/design/projects/new">New project</option><option value="/design/projects/qa">Project detail</option><option value="/design/products/new">New product</option><option value="/design/products/qa/templates/new">New template</option><option value="/design/products/qa/spec-sheet/new">New spec sheet</option><option value="/design/spec-sheets/qa">Spec sheet</option><option value="/design/products/qa">Product detail</option><option value="/design/products/qa/edit">Product edit</option><option value="/design/templates/qa">Template detail</option><option value="/design/templates/qa/edit">Template edit</option><option value="/design/projects">Projects</option><option value="/design/products">Gallery</option><option value="/design/templates">JSON templates</option><option value="/design/generations">Generations</option><option value="/design/tools">Workbench guide</option></select></label><label>Width <select id="width"><option>320</option><option selected>375</option><option>414</option><option>1280</option></select></label><p id="measure"></p><pre id="result" role="status" style="max-height:180px;overflow:auto"></pre><iframe title="Actual Product Design page" src="/design/projects" style="width:375px;height:800px;border:1px solid #ddd"></iframe><script>
const frame=document.querySelector('iframe'),pages=document.querySelector('#page'),widths=document.querySelector('#width'),result=document.querySelector('#result'),run=document.querySelector('#run'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));pages.onchange=()=>frame.src=pages.value;widths.onchange=()=>frame.style.width=widths.value+'px';frame.onload=()=>{const d=frame.contentDocument;if(!d.body)return;const measure=()=>document.querySelector('#measure').textContent='Viewport '+d.documentElement.clientWidth+' / content '+d.documentElement.scrollWidth;new ResizeObserver(measure).observe(d.body);measure()};const check=(b,s)=>{if(!b)throw Error(s)};
async function ready(){const until=Date.now()+5000;while(Date.now()<until){if(frame.contentDocument?.querySelector('[aria-label="Product Design navigation"]'))return;await tick()}throw Error('Navigation did not load')}
run.onclick=async()=>{run.disabled=true;const rows=[];try{for(const page of [...pages.options].map(o=>o.value))for(const width of [320,375,414,1280]){pages.value=page;widths.value=String(width);frame.style.width=width+'px';const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.src=page;await loaded;await ready();await tick();let d=frame.contentDocument,nav=d.querySelector('[aria-label="Product Design navigation"]'),projectLink=nav.querySelector('a'),toggle=nav.querySelector('button'),panel=d.getElementById(toggle.getAttribute('aria-controls'));check(projectLink.getAttribute('href')==='/design/projects','Projects return missing');check(projectLink.getAttribute('aria-current')===(page.startsWith('/design/projects')?'page':null),'Wrong Projects selection');if(toggle.getAttribute('aria-expanded')!=='true'){toggle.click();await tick()}check(!panel.hidden,'Tools did not open');check(d.documentElement.scrollWidth<=width,'Page overflows');check(Math.abs(nav.getBoundingClientRect().left-panel.getBoundingClientRect().left)<1&&Math.abs(nav.getBoundingClientRect().width-panel.getBoundingClientRect().width)<1,'Panel not full-width aligned');const links=[...panel.querySelectorAll('a')];check(links.length===4,'Tools missing');if(!page.startsWith('/design/projects'))check((panel.querySelector('[aria-current="page"]')?.getAttribute('href')??null)===(page.includes('/customers/')?null:page.includes('/templates/new')?'/design/templates':page.includes('/products/')||page.includes('/spec-sheets/')?'/design/products':page.includes('/templates/')?'/design/templates':page),'Wrong selected tool');for(const e of [projectLink,toggle,...links]){const r=e.getBoundingClientRect();check(r.height>=44,'Small target');check(r.left>=0&&r.right<=width,'Control clipped')}toggle.click();await tick();check(panel.hidden,'Tools did not close');projectLink.click();await tick();check(frame.contentDocument.querySelector('h1').textContent==='Design projects','Projects return failed');rows.push({page,width,result:'PASS'});result.textContent=JSON.stringify(rows,null,2)}result.textContent='PASS all 64 desktop/mobile cases\n'+JSON.stringify(rows,null,2)}catch(e){result.textContent='FAIL '+e.message+'\n'+JSON.stringify(rows,null,2)}finally{run.disabled=false}}
</script></body></html>
