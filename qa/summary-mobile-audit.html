<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile summary audit</title></head>
<body>
<label>Mobile width <select id="width"><option>320</option><option selected>375</option><option>414</option></select></label>
<label>Page <select id="page"><option value="/dashboard">Dashboard</option><option value="/customer">Customer page</option></select></label>
<button id="run">Run mobile regression checks</button>
<p id="measure"></p><pre id="results" role="status" style="max-height:180px;overflow:auto"></pre>
<iframe title="Mobile page" src="/dashboard" style="width:375px;height:812px;border:1px solid #aaa"></iframe>
<script>
const frame=document.querySelector('iframe'),widthSelect=document.querySelector('#width'),pageSelect=document.querySelector('#page'),results=document.querySelector('#results');
const nextFrame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
function metrics(){const d=frame.contentDocument;if(!d?.body)return null;return {viewport:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,main:d.querySelector('main')?[d.querySelector('main').clientWidth,d.querySelector('main').scrollWidth]:null,summaryWidths:[...d.querySelectorAll('p[id]')].map(p=>[p.clientWidth,p.scrollWidth,p.textContent.length]),toggles:[...d.querySelectorAll('button')].filter(b=>/^Show (more|less)$/.test(b.textContent)).map(b=>({text:b.textContent,height:b.getBoundingClientRect().height,width:b.getBoundingClientRect().width}))}}
function measure(){document.querySelector('#measure').textContent=JSON.stringify(metrics())}
widthSelect.onchange=()=>{frame.style.width=widthSelect.value+'px'};
pageSelect.onchange=()=>{frame.src=pageSelect.value};
frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d?.body)return;new ResizeObserver(measure).observe(d.body);new MutationObserver(measure).observe(d.body,{subtree:true,childList:true,characterData:true});measure()});
const check=(ok,message)=>{if(!ok)throw Error(message)};
function fits(){const m=metrics();check(m.content<=m.viewport,'Page overflows horizontally');if(m.main)check(m.main[1]<=m.main[0],'Main content overflows horizontally');for(const [client,scroll] of m.summaryWidths)check(scroll<=client,'Summary text overflows');for(const b of m.toggles)check(b.height>=44&&b.width>=44,'Toggle target smaller than 44px')}
async function ready(){const until=Date.now()+5000;while(Date.now()<until){if(frame.contentDocument?.querySelector('button[aria-controls]'))return;await nextFrame()}throw Error('Summary did not render')}
document.querySelector('#run').onclick=async()=>{
 const run=document.querySelector('#run');run.disabled=true;results.textContent='Running…';const rows=[];
 try{for(const page of ['/dashboard','/customer'])for(const width of [320,375,414]){
  widthSelect.value=String(width);pageSelect.value=page;frame.style.width=width+'px';
  const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src=page;await loaded;await ready();await nextFrame();fits();
  const d=frame.contentDocument,buttons=[...d.querySelectorAll('button')].filter(b=>b.textContent==='Show more');check(buttons.length=== (page==='/customer'?3:1),'Expected summary sections missing');
  for(const button of buttons){const p=d.getElementById(button.getAttribute('aria-controls')),short=p.textContent;button.focus();check(d.activeElement===button,'Toggle not focusable');button.click();await nextFrame();check(button.textContent==='Show less'&&button.getAttribute('aria-expanded')==='true','Expansion failed');check(p.textContent.length>short.length&&p.textContent.includes('Final detail:'),'Full text missing');fits();button.click();await nextFrame();check(button.textContent==='Show more'&&p.textContent===short,'Collapse did not restore preview');const main=d.querySelector('main'),bounds=main.getBoundingClientRect();check(p.getBoundingClientRect().top>=bounds.top-1&&button.getBoundingClientRect().bottom<=bounds.bottom,'Collapse lost the preview in scroll position');fits()}
  check([...d.querySelectorAll('button')].some(b=>b.textContent==='Add task')&&[...d.querySelectorAll('button')].some(b=>b.textContent==='Add note'),'Task/note controls missing');
  if(page==='/customer')check(d.body.textContent.includes('Keep this commitment visible'),'Commitment disappeared');
  rows.push({page,width,result:'PASS',toggles:buttons.length,...metrics()});results.textContent=JSON.stringify(rows,null,2);
 }results.textContent='PASS — all 6 mobile page/width combinations\n'+JSON.stringify(rows,null,2)}catch(error){results.textContent='FAIL — '+error.message+'\n'+JSON.stringify(rows,null,2)}finally{run.disabled=false;measure()}
};
</script></body></html>
