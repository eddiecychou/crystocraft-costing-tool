<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swatch Library — Admin</title>
<style>
  :root {
    --bg: #131319; --surface: #1b1c24; --surface-2: #23252f;
    --border: rgba(255,255,255,0.09); --text: #ece8df; --text-dim: #93939f; --text-faint: #5f606c;
    --accent: #c6a664; --accent-soft: rgba(198,166,100,0.14); --danger: #c1553f; --ok: #7fae7f;
    --font-display: ui-serif, "Iowan Old Style", Georgia, serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font-sans: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  h1 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; }
  h1 .accent { color: var(--accent); font-style: italic; }
  header { padding: 16px 28px; border-bottom: 1px solid var(--border); }
  .subhead { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 76px); }
  .sidebar { border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
  .sidebar h2 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 12px; }
  .swatch-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 3px; cursor: pointer; border: 1px solid transparent; }
  .swatch-row:hover { background: var(--surface); }
  .swatch-row.active { border-color: var(--accent); background: var(--accent-soft); }
  .swatch-row .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0; border: 1px solid var(--border); background-size: cover; background-position: center; }
  .swatch-row .name { font-size: 13px; flex: 1; }
  .badge-row { display: flex; gap: 3px; }
  .badge { font-family: var(--font-mono); font-size: 8.5px; padding: 1px 4px; border-radius: 2px; background: var(--surface-2); color: var(--text-faint); }
  .badge.have { background: var(--accent-soft); color: var(--accent); }
  button { font-family: var(--font-mono); font-size: 12px; cursor: pointer; border-radius: 3px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 8px 14px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { opacity: .9; color: #1a1408; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.small { padding: 5px 10px; font-size: 11px; }
  button.active-toggle { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #add-new { width: 100%; margin-bottom: 14px; }
  .editor { padding: 24px 28px; }
  .editor-grid { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
  .style-tabs { display: flex; gap: 2px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2px; width: fit-content; }
  .style-tabs button { font-size: 11.5px; padding: 7px 12px; }
  .style-tabs button.active { background: var(--accent-soft); color: var(--accent); }
  .style-note { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 16px; line-height: 1.5; max-width: 700px; }
  .backfilm-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; max-width: 700px; }
  .backfilm-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .backfilm-chip .swatch { width: 52px; height: 52px; border-radius: 4px; border: 2px solid var(--border); background-size: cover; background-position: center; background-color: var(--surface-2); }
  .backfilm-chip.active .swatch { border-color: var(--accent); }
  .backfilm-chip .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); max-width: 60px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .backfilm-chip.active .label { color: var(--accent); }
  .backfilm-chip.new .swatch { border-style: dashed; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-faint); }
  .drop-zone { border: 1px dashed var(--border); border-radius: 4px; padding: 40px; text-align: center; color: var(--text-faint); font-family: var(--font-mono); font-size: 12px; cursor: pointer; }
  .drop-zone:hover { border-color: var(--accent); color: var(--accent); }
  canvas { max-width: 100%; border-radius: 3px; cursor: crosshair; display: block; }
  .canvas-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 12px; }
  .canvas-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .canvas-hint { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 16px; margin-bottom: 14px; }
  .panel label { display: block; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); letter-spacing: .03em; margin-bottom: 6px; }
  .panel .help { font-family: var(--font-sans); font-size: 11px; color: var(--text-faint); margin: -3px 0 10px; line-height: 1.5; }
  .panel input[type=text] { width: 100%; font-size: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; color: var(--text); margin-bottom: 14px; }
  .panel select { width: 100%; font-size: 13px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; color: var(--text); }
  .pitch-val { font-family: var(--font-mono); color: var(--accent); font-size: 13px; }
  .preview-tile { width: 100%; aspect-ratio: 1; background: var(--surface-2); border-radius: 3px; object-fit: cover; }
  .preview-hint { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); margin-top: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; }
  .status { font-family: var(--font-mono); font-size: 11px; padding: 8px 10px; border-radius: 3px; margin-bottom: 14px; display: none; }
  .status.show { display: block; }
  .status.ok { background: rgba(127,174,127,.12); color: var(--ok); }
  .status.err { background: rgba(193,85,63,.12); color: var(--danger); }
  .empty-state { color: var(--text-faint); font-family: var(--font-mono); font-size: 13px; padding: 60px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Swatch <span class="accent">Library</span> — Admin <span class="subhead" id="service-version" style="display:inline"></span></h1>
  <div class="subhead">capture, crop, and calibrate crystal swatches — each colour × stone size × backfilm is its own real photo, changes apply on the next render, no deploy needed</div>
</header>
<main>
  <div class="sidebar">
    <button id="add-new" class="primary">+ Add new colour</button>
    <button id="test-render" style="width:100%;margin-bottom:14px">🧪 Test render</button>
    <button id="templates-nav" style="width:100%;margin-bottom:14px">🗂️ Product templates</button>
    <h2>Crystal colours</h2>
    <div id="swatch-list"></div>
  </div>
  <div class="editor" id="editor">
    <div class="empty-state">Select a colour to edit, or add a new one.</div>
  </div>
</main>

<script>
  const AUTH_TEST = fetch('/swatches').then(r => { if (!r.ok) throw new Error('auth'); return r.json(); });

  // Shows which build is actually live — bump app.py's FastAPI `version` on
  // any deploy that changes render behaviour (owner, 2026-08-06).
  fetch('/health').then(r => r.json()).then(h => {
    const el = document.getElementById('service-version');
    if (el && h.version) el.textContent = `· v${h.version}`;
  }).catch(() => {});

  let swatches = { crystal: {} };
  let knownBackfilms = [];
  let currentName = null;
  let currentStyle = 'fabric';       // 'fabric' | 'rock' — no generic, see palette.py
  let currentBackfilm = null;        // null while capturing a NEW backfilm
  let workingImage = null;
  let workingBlob = null;
  let displayScale = 1;
  let crop = null;
  let measureMode = false;
  let measurePoint = null;           // first click while measuring
  let pitchPx = 16;
  let compare = { name: '', style: '', backfilm: '' };
  let previewDebounce = null;
  // Batch capture — see the batch-row button's HTML comment. freshUpload
  // distinguishes "user just picked a photo" (batch capture makes sense)
  // from "we loaded an already-saved slot's photo to re-edit it" (a single
  // fix, not a batch op). batchCount resets whenever a genuinely new photo
  // is chosen, not on every save-next iteration.
  let freshUpload = false;
  let batchCount = 0;

  const STYLE_LABEL = {
    fabric: 'Crystal Fabric (0.8–1mm) — a genuinely different cut/mix than Rock, needs its own photo',
    rock: 'Crystal Rock — used for BOTH Fine Rock (1.5mm) and Rock (2.0mm): same cut, just a size difference',
  };

  async function loadSwatches() {
    const [sw, bf] = await Promise.all([
      fetch('/swatches').then(r => r.json()),
      fetch('/swatches/backfilms').then(r => r.json()),
    ]);
    swatches = sw;
    knownBackfilms = bf;
    renderList();
  }

  function renderList() {
    const el = document.getElementById('swatch-list');
    el.innerHTML = '';
    const entries = Object.entries(swatches.crystal || {}).sort(([a], [b]) => a.localeCompare(b));
    entries.forEach(([name, s]) => {
      const row = document.createElement('div');
      row.className = 'swatch-row' + (name === currentName ? ' active' : '');
      const anyFabric = Object.values(s.slots.fabric || {})[0];
      const anyRock = Object.values(s.slots.rock || {})[0];
      const thumbUrl = (anyFabric || anyRock)?.url;
      const dotStyle = thumbUrl ? `background-image:url(${thumbUrl})` : `background:rgb(${s.rgb.map(x => Math.round(x * 255)).join(',')})`;
      const fCount = Object.keys(s.slots.fabric || {}).length;
      const rCount = Object.keys(s.slots.rock || {}).length;
      row.innerHTML = `
        <div class="dot" style="${dotStyle}"></div>
        <span class="name">${name}</span>
        <div class="badge-row">
          <span class="badge ${fCount ? 'have' : ''}">F${fCount ? '·' + fCount : ''}</span>
          <span class="badge ${rCount ? 'have' : ''}">R${rCount ? '·' + rCount : ''}</span>
        </div>`;
      row.addEventListener('click', () => editCrystal(name));
      el.appendChild(row);
    });
  }

  function allCombos(excludeName) {
    const out = [];
    Object.entries(swatches.crystal || {}).forEach(([name, s]) => {
      ['fabric', 'rock'].forEach(style => {
        Object.keys(s.slots[style] || {}).forEach(bf => {
          if (!(name === excludeName && style === currentStyle && bf === currentBackfilm)) {
            out.push({ name, style, backfilm: bf });
          }
        });
      });
    });
    return out;
  }

  // ── Editor shell ─────────────────────────────────────────────────────────
  function crystalShell(name, isNew) {
    document.getElementById('editor').innerHTML = `
      <div class="panel" style="max-width:560px">
        <label>Colour name</label>
        <input type="text" id="name-input" value="${name}" ${isNew ? 'placeholder="e.g. Colorado Topaz"' : 'readonly style="opacity:.6"'} />
      </div>
      <div class="style-tabs" id="style-tabs">
        <button class="active" data-style="fabric">Fabric</button>
        <button data-style="rock">Rock (Fine Rock + Rock)</button>
      </div>
      <div class="style-note" id="style-note"></div>
      <div class="backfilm-row" id="backfilm-row"></div>
      <div class="editor-grid">
        <div>
          <div class="canvas-wrap" id="canvas-wrap">
            <div class="drop-zone" id="drop-zone">Click to choose a photo, or drag one here.<br>The whole photo is used as-is — crop it before uploading.</div>
          </div>
          <input type="file" id="file-input" accept="image/*" style="display:none">
          <!-- Live preview sits RIGHT UNDER the crop canvas, not off in the
               far column, so you always see your crop and its tiled result
               together — and a save (which reflows the chip row above) can't
               push it out of view. -->
          <div class="panel" style="margin-top:14px">
            <label>Live preview — how this swatch will tile in a render</label>
            <img class="preview-tile" id="preview-tile" alt="" />
            <div class="preview-hint" id="preview-hint">Measure a stone on the photo to see the tiled result here.</div>
          </div>
        </div>
        <div>
          <div class="status" id="status"></div>
          <div class="panel" id="backfilm-name-panel">
            <label>Backfilm — what is this crystal photographed against?</label>
            <div class="help">Not a colour you pick from a fixed list — this is the REAL backing in the photo you're about to crop. "Crystal AB on white" and "Crystal AB on black" are different swatches, not the same photo tinted two ways.</div>
            <input type="text" id="backfilm-input" list="backfilm-suggestions" placeholder="e.g. White, Black, Rose Gold" />
            <datalist id="backfilm-suggestions">${knownBackfilms.map(n => `<option value="${n}">`).join('')}</datalist>
          </div>
          <div class="panel">
            <label>Stone pitch — <span class="pitch-val" id="pitch-val">16</span>px <span id="pitch-source" style="color:var(--text-faint);font-weight:normal"></span></label>
            <div class="help">Not an abstract number to guess — click "Measure a stone", then click one edge of a single stone in the photo and its opposite edge. The distance between your two clicks becomes the pitch, directly.</div>
            <button class="small" id="measure-btn" type="button">📏 Measure a stone</button>
          </div>
          <div class="actions">
            <button id="save-btn" class="primary" disabled>Save this swatch</button>
          </div>
          <!-- Batch capture: one photo (a swatch card) commonly shows MANY
               backfilm colours at once. Re-uploading that same photo for
               every single patch was the friction that made "shoot 15-20
               real sellers" feel like "shoot 100" (owner, 2026-08-01).
               This button saves the current crop, then keeps the SAME
               photo loaded — just clears the crop box and backfilm name —
               so the next region on the same card is a drag + a name away,
               no re-upload. Pitch carries over too: one physical photo has
               one real scale, so it's very likely still correct. -->
          <div class="actions" id="batch-row" style="display:none">
            <button id="save-next-btn" class="primary" disabled>Save &amp; capture next region →</button>
          </div>
          <div class="panel" id="batch-status" style="display:none">
            <span id="batch-count"></span> saved from this photo so far.
          </div>
          <div class="actions" id="remove-row" style="display:none">
            <button id="remove-style-btn" class="danger">Remove this photo</button>
          </div>
          <div class="panel" style="margin-top:14px">
            <label>Compare with (optional)</label>
            <div class="help">Show this crop next to another already-saved REAL photo — e.g. the same colour's other backfilm — for consistency-checking. Both sides are real captures, nothing is synthesized.</div>
            <select id="compare-select"></select>
          </div>
        </div>
      </div>
      ${isNew ? '' : `<div class="actions" style="max-width:560px;margin-top:24px;border-top:1px solid var(--border);padding-top:16px"><button id="delete-btn" class="danger">Delete "${name}" entirely (all photos)</button></div>`}
    `;
    document.getElementById('style-tabs').addEventListener('click', e => {
      const btn = e.target.closest('button'); if (!btn) return;
      document.querySelectorAll('#style-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      renderBackfilmRow();
      selectBackfilm(Object.keys((swatches.crystal[currentName]?.slots[currentStyle]) || {})[0] || null);
    });
    wireDropZone();
    document.getElementById('measure-btn').addEventListener('click', () => {
      if (!workingImage) { showStatus('Choose a photo first.', 'err'); return; }
      measureMode = true;
      measurePoint = null;
      document.getElementById('measure-btn').classList.add('active-toggle');
      document.getElementById('measure-btn').textContent = '📏 Click one edge of a stone…';
    });
    document.getElementById('compare-select').addEventListener('change', e => {
      const v = e.target.value;
      if (!v) { compare = { name: '', style: '', backfilm: '' }; }
      else { const [name, style, backfilm] = v.split('::'); compare = { name, style, backfilm }; }
      schedulePreview();
    });
    document.getElementById('save-btn').addEventListener('click', saveCrystal);
    document.getElementById('save-next-btn').addEventListener('click', saveCrystalAndNext);
    document.getElementById('backfilm-input').addEventListener('input', e => {
      const btn = document.getElementById('save-next-btn');
      if (btn) btn.disabled = !(crop && e.target.value.trim());
    });
    const del = document.getElementById('delete-btn');
    if (del) del.addEventListener('click', () => removeCrystal(name));
  }

  function renderBackfilmRow() {
    const note = document.getElementById('style-note');
    note.textContent = STYLE_LABEL[currentStyle];
    note.className = 'style-note';
    const entry = currentName ? swatches.crystal[currentName] : null;
    const slots = entry ? (entry.slots[currentStyle] || {}) : {};
    if (entry && Object.keys(slots).length === 0) {
      note.className = 'style-note missing';
      note.textContent += ' — NOT YET CAPTURED for any backfilm. A render asking for this will raise an error until you add one.';
    }
    const row = document.getElementById('backfilm-row');
    row.innerHTML = '';
    Object.entries(slots).sort(([a], [b]) => a.localeCompare(b)).forEach(([bf, slot]) => {
      const chip = document.createElement('div');
      chip.className = 'backfilm-chip' + (bf === currentBackfilm ? ' active' : '');
      chip.innerHTML = `<div class="swatch" style="background-image:url(${slot.url})"></div><div class="label">${bf}</div>`;
      chip.addEventListener('click', () => selectBackfilm(bf));
      row.appendChild(chip);
    });
    const addChip = document.createElement('div');
    addChip.className = 'backfilm-chip new';
    addChip.innerHTML = `<div class="swatch">+</div><div class="label">Add backfilm</div>`;
    addChip.addEventListener('click', () => selectBackfilm(null));
    row.appendChild(addChip);
    updateCompareOptions();
  }

  function updateCompareOptions() {
    const sel = document.getElementById('compare-select');
    if (!sel) return;
    const combos = allCombos(currentName);
    sel.innerHTML = '<option value="">— none —</option>' +
      combos.map(c => `<option value="${c.name}::${c.style}::${c.backfilm}">${c.name} · ${c.style} · ${c.backfilm}</option>`).join('');
  }

  function markSaved(bf) {
    // Post-save UI refresh that leaves canvas/crop/preview untouched — see
    // saveCrystal()'s comment for why selectBackfilm()/crystalShell() are
    // wrong here.
    renderBackfilmRow();
    document.querySelectorAll('.backfilm-chip').forEach(c => {
      c.classList.toggle('active', c.querySelector('.label')?.textContent === bf);
    });
    const nameInput = document.getElementById('backfilm-input');
    nameInput.value = bf;
    nameInput.readOnly = true;
    nameInput.style.opacity = '.6';
    document.getElementById('remove-row').style.display = 'flex';
    document.getElementById('remove-style-btn').onclick = () => removePhoto(currentName, currentStyle, bf);
    document.getElementById('pitch-source').textContent = '(saved)';
  }

  function selectBackfilm(bf) {
    currentBackfilm = bf;
    crop = null; workingImage = null; workingBlob = null; pitchPx = 16;
    measureMode = false; measurePoint = null;
    freshUpload = false; batchCount = 0;   // stale until the next loadFile() sets it
    document.querySelectorAll('.backfilm-chip').forEach(c => c.classList.remove('active'));
    document.getElementById('preview-tile').src = '';
    document.getElementById('preview-hint').textContent = 'Measure a stone on the photo to see the tiled result here.';
    document.getElementById('save-btn').disabled = true;
    document.getElementById('batch-row').style.display = 'none';
    document.getElementById('batch-status').style.display = 'none';
    document.getElementById('pitch-val').textContent = '16';
    document.getElementById('pitch-source').textContent = '';
    const nameInput = document.getElementById('backfilm-input');
    const removeRow = document.getElementById('remove-row');
    const entry = currentName ? swatches.crystal[currentName] : null;
    const slot = (bf && entry) ? entry.slots[currentStyle][bf] : null;
    if (bf) {
      nameInput.value = bf;
      nameInput.readOnly = true;
      nameInput.style.opacity = '.6';
    } else {
      nameInput.value = '';
      nameInput.readOnly = false;
      nameInput.style.opacity = '1';
    }
    removeRow.style.display = slot ? 'flex' : 'none';
    document.getElementById('canvas-wrap').innerHTML = '<div class="drop-zone" id="drop-zone">Click to choose a photo, or drag one here.<br>The whole photo is used as-is — crop it before uploading.</div>';
    wireDropZone();
    if (slot) {
      // Load the saved photo straight into the SAME interactive crop
      // canvas, editable immediately — no separate "view" vs "edit" step.
      // drawCanvas() always displays at a fixed comfortable width regardless
      // of the source photo's actual size, so re-dragging a crop on an
      // already-small saved swatch is still precise, not fiddly.
      document.getElementById('remove-style-btn').onclick = () => removePhoto(currentName, currentStyle, bf);
      pitchPx = slot.pitch;
      document.getElementById('pitch-val').textContent = slot.pitch;
      document.getElementById('pitch-source').textContent = '(saved)';
      fetch(slot.url).then(r => r.blob()).then(b => loadFile(b, false));
    }
    document.querySelectorAll('.backfilm-chip').forEach(c => {
      if (c.querySelector('.label')?.textContent === bf) c.classList.add('active');
    });
    updateCompareOptions();
  }

  function wireDropZone() {
    const dz = document.getElementById('drop-zone');
    if (!dz) return;
    dz.addEventListener('click', () => document.getElementById('file-input').click());
    const wrap = document.getElementById('canvas-wrap');
    wrap.addEventListener('dragover', e => e.preventDefault());
    wrap.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
  }

  document.body.addEventListener('change', e => {
    if (e.target.id === 'file-input' && e.target.files[0]) loadFile(e.target.files[0]);
  });

  // ── Test render ──────────────────────────────────────────────────────────
  // Runs the exact same engine.render() the customer flow calls (via
  // /admin/render-test, gated by ADMIN_PASSWORD — not the customer-facing
  // RENDER_TOKEN route), so a colour/backfilm/mode combo can be checked here
  // — with the real error message — before a customer hits it in the portal.
  let testLogoFile = null;

  // Colour names that actually have a photo for the given style ('fabric' or
  // 'rock') — the ONLY thing that should ever be offered, so picking a
  // colour can never itself produce a render error (owner, 2026-08-06: "for
  // the crystals which doesn't have the swatch will return error. Better
  // just filter it out").
  function namesForStyle(style) {
    return Object.entries(swatches.crystal || {})
      .filter(([, s]) => Object.keys(s.slots[style] || {}).length > 0)
      .map(([name]) => name)
      .sort();
  }
  const STYLE_OF_TYPE = { 'fabric_1.0': 'fabric', 'fine_rock_1.5': 'rock', 'rock_2.0': 'rock' };
  // Only Crystal AB is genuinely transparent/coated — every other captured
  // colour is opaque or metallic-coated and would hide the printed graphic
  // underneath in the real product (owner, 2026-08-06). Mirrors
  // src/customizerApi.js's PRINTED_MODE_COLORS.
  const PRINTED_MODE_COLORS = ['Crystal AB'];

  function testRenderShell() {
    currentName = null;
    renderList();
    document.getElementById('editor').innerHTML = `
      <div class="editor-grid">

  function loadFile(fileOrBlob, isFresh = true) {
    freshUpload = isFresh;
    if (isFresh) batchCount = 0;
    return new Promise(resolve => {
      const url = URL.createObjectURL(fileOrBlob);
      const img = new Image();
      img.onload = () => {
        workingImage = img; workingBlob = fileOrBlob; measureMode = false; measurePoint = null;
        // Uploaded photos are already cropped to a single swatch (owner,
        // 2026-08-06) — no in-browser crop step needed, the whole photo IS
        // the swatch. Just measure a stone's pitch on it.
        crop = { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
        drawCanvas();
        resolve();
      };
      img.src = url;
    });
  }

  function drawCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    wrap.innerHTML = `
      <div class="canvas-toolbar">
        <button class="small" id="change-photo-btn">Change photo</button>
        <span class="canvas-hint" id="canvas-hint">Click "Measure a stone" to set scale, then Save.</span>
      </div>`;
    document.getElementById('change-photo-btn').addEventListener('click', () => document.getElementById('file-input').click());
    const batchRow = document.getElementById('batch-row');
    const batchStatus = document.getElementById('batch-status');
    // Batch capture assumed one photo held several patches to crop out
    // separately — now that uploads are pre-cropped to a single swatch
    // (2026-08-06), "save & capture next region from this same photo" would
    // just save the identical photo twice under two different backfilm
    // names, which is wrong. Hidden rather than removed in case that
    // workflow comes back.
    if (batchRow) batchRow.style.display = 'none';
    if (batchStatus) batchStatus.style.display = (freshUpload && batchCount > 0) ? 'block' : 'none';
    if (batchStatus) document.getElementById('batch-count').textContent = batchCount;
    // Always fit to a fixed comfortable width, purely for display — crop is
    // always the full photo now, this scale only matters for the measure
    // click coordinates.
    const maxW = 480;
    displayScale = maxW / workingImage.naturalWidth;
    const w = Math.round(workingImage.naturalWidth * displayScale);
    const h = Math.round(workingImage.naturalHeight * displayScale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    wrap.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(workingImage, 0, 0, w, h);

    function toCanvasXY(e) {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
    }

    const saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.disabled = false;
    const saveNextBtn = document.getElementById('save-next-btn');
    if (saveNextBtn) saveNextBtn.disabled = !document.getElementById('backfilm-input').value.trim();
    schedulePreview();

    canvas.addEventListener('click', e => {
      if (!measureMode) return;
      const p = toCanvasXY(e);
      if (!measurePoint) {
        measurePoint = p;
        document.getElementById('measure-btn').textContent = '📏 Click the opposite edge of that stone…';
        redrawCanvasBase(ctx, w, h);
        ctx.fillStyle = '#c6a664';
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
        return;
      }
      const dx = p.x - measurePoint.x, dy = p.y - measurePoint.y;
      const distPx = Math.sqrt(dx * dx + dy * dy) / displayScale;
      pitchPx = Math.max(2, Math.round(distPx * 10) / 10);
      document.getElementById('pitch-val').textContent = pitchPx;
      document.getElementById('pitch-source').textContent = '(measured)';
      redrawCanvasBase(ctx, w, h);
      ctx.strokeStyle = '#c6a664'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(measurePoint.x, measurePoint.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      [measurePoint, p].forEach(pt => { ctx.fillStyle = '#c6a664'; ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2); ctx.fill(); });
      measureMode = false; measurePoint = null;
      const btn = document.getElementById('measure-btn');
      btn.classList.remove('active-toggle');
      btn.textContent = '📏 Measure a stone';
      schedulePreview();
    });
  }

  function redrawCanvasBase(ctx, w, h) {
    ctx.drawImage(workingImage, 0, 0, w, h);
  }


  function schedulePreview() {
    clearTimeout(previewDebounce);
    previewDebounce = setTimeout(runPreview, 250);
  }

  async function runPreview() {
    if (!crop || !workingBlob) return;
    const hint = document.getElementById('preview-hint');
    hint.textContent = 'Rendering…';
    const fd = new FormData();
    fd.append('image', workingBlob, 'photo.jpg');
    fd.append('crop_x', crop.x); fd.append('crop_y', crop.y);
    fd.append('crop_w', crop.w); fd.append('crop_h', crop.h);
    fd.append('pitch', pitchPx);
    fd.append('material', currentStyle === 'fabric' ? 'fabric_1.0' : 'rock_2.0');
    if (compare.name) {
      fd.append('compare_name', compare.name);
      fd.append('compare_style', compare.style);
      fd.append('compare_backfilm', compare.backfilm);
    }
    try {
      const res = await fetch('/swatches/preview', { method: 'POST', body: fd });
      if (!res.ok) throw new Error(await res.text());
      const blob = await res.blob();
      document.getElementById('preview-tile').src = URL.createObjectURL(blob);
      hint.textContent = compare.name ? `Compared with ${compare.name} · ${compare.style} · ${compare.backfilm}.` : '';
    } catch (e) {
      hint.textContent = 'Preview failed — try a different crop.';
    }
  }

  // Shared by saveCrystal() and saveCrystalAndNext() — one POST, one place
  // that knows the request shape. Throws on failure; caller decides what
  // "after" looks like (single-save locks the row, batch clears for the
  // next region).
  async function postSwatchSave(name, backfilm) {
    const fd = new FormData();
    fd.append('name', name); fd.append('style', currentStyle); fd.append('backfilm', backfilm);
    fd.append('image', workingBlob, 'photo.jpg');
    fd.append('crop_x', crop.x); fd.append('crop_y', crop.y);
    fd.append('crop_w', crop.w); fd.append('crop_h', crop.h);
    fd.append('pitch', pitchPx);
    const res = await fetch('/swatches/save', { method: 'POST', body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || 'Save failed');
  }

  async function saveCrystal() {
    const name = document.getElementById('name-input').value.trim();
    const backfilm = document.getElementById('backfilm-input').value.trim();
    if (!name) { showStatus('A colour name is required.', 'err'); return; }
    if (!backfilm) { showStatus('A backfilm name is required — what is this photographed against?', 'err'); return; }
    if (!crop || !workingBlob) { showStatus('Choose a photo first.', 'err'); return; }
    document.getElementById('save-btn').disabled = true;
    try {
      await postSwatchSave(name, backfilm);
      showStatus(`Saved "${name}" — ${currentStyle} on ${backfilm}.`, 'ok');
      currentName = name;
      currentBackfilm = backfilm;
      // Deliberately NOT crystalShell()/selectBackfilm() here — both wipe
      // the canvas, crop box, and live preview you just confirmed, which
      // made the save feel like it discarded your work. loadSwatches()
      // only touches the sidebar list; markSaved() updates the backfilm
      // chip row and this panel's "saved" state without touching the
      // canvas/crop/preview at all, so what you see after Save is exactly
      // what you had before it.
      await loadSwatches();
      markSaved(backfilm);
    } catch (e) {
      showStatus(e.message, 'err');
    } finally {
      const b = document.getElementById('save-btn'); if (b) b.disabled = false;
    }
  }

  // Batch capture's save — keeps the SAME photo loaded, clears just the
  // crop box and backfilm name so the next region is a drag + a name away.
  // Pitch is deliberately NOT reset: one physical photo has one real scale,
  // so the last measurement is very likely still correct for the next
  // region on the same card. Re-measure only if this crop looks off.
  async function saveCrystalAndNext() {
    const name = document.getElementById('name-input').value.trim();
    const backfilm = document.getElementById('backfilm-input').value.trim();
    if (!name) { showStatus('A colour name is required.', 'err'); return; }
    if (!backfilm) { showStatus('A backfilm name is required — what is this photographed against?', 'err'); return; }
    if (!crop || !workingBlob) { showStatus('Choose a photo first.', 'err'); return; }
    const nextBtn = document.getElementById('save-next-btn');
    nextBtn.disabled = true;
    document.getElementById('save-btn').disabled = true;
    try {
      await postSwatchSave(name, backfilm);
      batchCount += 1;
      showStatus(`Saved "${name}" — ${currentStyle} on ${backfilm}. Drag the next region and name it.`, 'ok');
      currentName = name;
      await loadSwatches();
      renderBackfilmRow();   // refreshes the chip row; does NOT touch the canvas
      // Clear crop + name, keep photo + pitch, ready for the next region.
      crop = null;
      const ctx = document.querySelector('#canvas-wrap canvas')?.getContext('2d');
      const c = document.querySelector('#canvas-wrap canvas');
      if (ctx && c) ctx.drawImage(workingImage, 0, 0, c.width, c.height);   // clear the old crop-box outline
      const nameInput = document.getElementById('backfilm-input');
      nameInput.value = '';
      nameInput.readOnly = false;
      nameInput.style.opacity = '1';
      nameInput.focus();
      document.getElementById('save-btn').disabled = true;
      document.getElementById('batch-status').style.display = 'block';
      document.getElementById('batch-count').textContent = batchCount;
    } catch (e) {
      showStatus(e.message, 'err');
    } finally {
      nextBtn.disabled = true;
    }
  }

  // ── Product template library ─────────────────────────────────────────────

  function setTemplatePhoto(file) {
    if (!file) return;
    templatePhotoFile = file;
    document.getElementById('tmpl-photo-zone').textContent = `✓ ${file.name}`;
  }

  function setTemplateSvg(file) {
    if (!file) return;
    templateSvgFile = file;
    const reader = new FileReader();
    reader.onload = () => {
      templateSvgText = reader.result;
      const status = document.getElementById('tmpl-svg-status');
      const shapeCount = (templateSvgText.match(/<(?:\w+:)?(path|polygon|polyline|rect|circle|ellipse)[\s/>]/g) || []).length;
      status.textContent = shapeCount === 1 ? '✓ one shape found' : `⚠ ${shapeCount} shapes found — server will reject anything but exactly 1`;
    };
    reader.readAsText(file);
    document.getElementById('tmpl-svg-zone').textContent = `✓ ${file.name}`;
  }

  async function loadTemplateList() {
    const res = await fetch('/templates');
    const { templates } = await res.json();
    const list = document.getElementById('template-list');
    if (!list) return;
    const ids = Object.keys(templates);
    if (ids.length === 0) {
      list.innerHTML = '<div class="empty-state">No templates yet.</div>';
      return;
    }
    list.innerHTML = ids.map(id => {
      const t = templates[id];
      return `
        <div class="swatch-row" style="cursor:default">
          <div class="dot" style="background-image:url('${t.photo_url}')"></div>
          <div class="name">${t.name}<br><span class="canvas-hint">${t.width_mm}×${t.height_mm}mm · ${id}</span></div>
          <button class="small" data-tmpl-design="${id}">Design</button>
          <button class="small danger" data-tmpl-delete="${id}">✕</button>
        </div>`;
    }).join('');
    list.querySelectorAll('[data-tmpl-delete]').forEach(btn => {
      btn.addEventListener('click', () => deleteTemplateRow(btn.dataset.tmplDelete));

    list.querySelectorAll('[data-tmpl-design]').forEach(btn => {
      btn.addEventListener('click', () => designCanvasShell(btn.dataset.tmplDesign, templates[btn.dataset.tmplDesign]));

  async function saveTemplate() {
    const name = document.getElementById('tmpl-name').value.trim();
    const width_mm = document.getElementById('tmpl-width').value;
    const height_mm = document.getElementById('tmpl-height').value;
    if (!name || !width_mm || !height_mm || !templatePhotoFile || !templateSvgFile) {
      showStatus('Name, width, height, photo and SVG are all required.', 'err');
      return;
    }
    const fd = new FormData();
    fd.append('name', name);
    fd.append('width_mm', width_mm);
    fd.append('height_mm', height_mm);
    fd.append('photo', templatePhotoFile);
    fd.append('svg', templateSvgFile);
    const res = await fetch('/templates/save', { method: 'POST', body: fd });
    if (!res.ok) { showStatus((await res.json()).detail || 'Save failed', 'err'); return; }
    showStatus('Template saved.', 'ok');
    templatePhotoFile = null; templateSvgFile = null; templateSvgText = '';
    document.getElementById('tmpl-name').value = '';
    document.getElementById('tmpl-width').value = '';
    document.getElementById('tmpl-height').value = '';
    document.getElementById('tmpl-photo-zone').textContent = 'Click or drag a photo here';
    document.getElementById('tmpl-svg-zone').textContent = 'Click or drag an .svg file here';
    document.getElementById('tmpl-svg-status').textContent = '';
    await loadTemplateList();
  }

  // ── Design canvas — workstream 1 (Crystal_Fabric_Studio_Spec.md §5d) ─────
  // Real-millimetre positioning surface for a graphic on top of a saved
  // template's product photo: drag to move, drag a corner to resize
  // (aspect-locked by default), grid/ruler in mm, undo/redo, and an
  // approximate small-size warning. Deliberately NOT the SVG-outline-aware
  // zone system (that's workstream 2) — the whole photo stands in for the
  // template's mm extent here, and nothing is persisted yet; this phase
  // only proves out the canvas mechanics the later workstreams build on.
  const MIN_FEATURE_MM = 4; // generous heuristic floor, not real stroke-width detection — see designCanvasShell's comment
  let dcState = null; // { tmpl, img, xMM, yMM, wMM, hMM, aspect, pxPerMM, dispW, dispH }
  let dcGraphicFile = null; // the raw File from a fresh upload — only set when re-uploading; a position-only save (drag/resize) doesn't need it, the server keeps the existing file
  let dcUndo = [];
  let dcRedo = [];
  let dcDrag = null; // { mode: 'move'|'resize', handle, startX, startY, orig }
  let dcWindowListenersBound = false; // window listeners are idempotent-safe (read globals), but only bind once — a new <canvas> is created each time design mode opens

  // ── Zones (workstream 2) ──────────────────────────────────────────────
  const ZONE_COLORS = ['#c6a664', '#7fae7f', '#7f9fae', '#ae7f9f', '#ae957f']; // one per zone slot, cycled by index
  let dcZoneMode = false;           // true while click-to-place-vertex is active (graphic drag disabled)
  // In-progress zone: rings already closed (outer boundary + any finished
  // holes) plus the ring currently being clicked. A hollow shape (logo,
  // letter) is outer boundary ring[0] + one hole ring per enclosed gap —
  // filled even-odd, so the parity naturally handles "hole inside a hole"
  // too without special-casing, though that's not a real case here.
  let dcCurrentZoneRings = [];      // completed rings for the zone being drawn now
  let dcCurrentRingPoints = [];     // points for whichever ring is active right now
  let dcZones = [];                 // completed zones for this template, mm coords — loaded from t.zones, saved via /templates/{id}/zones
  let dcSwatchColorsCache = null;   // GET /swatches result, fetched once per admin session

  async function dcColorOptionsFor(crystalType) {
    if (!dcSwatchColorsCache) {
      dcSwatchColorsCache = (await (await fetch('/swatches')).json()).crystal || {};
    }
    const style = crystalType === 'fabric_1.0' ? 'fabric' : 'rock';
    return Object.keys(dcSwatchColorsCache)
      .filter(name => Object.keys(dcSwatchColorsCache[name]?.slots?.[style] || {}).length > 0)
      .sort();
  }

  async function dcRefreshZoneColorSelect() {
    const typeSel = document.getElementById('dc-zone-type');
    const colorSel = document.getElementById('dc-zone-color');
    if (!typeSel || !colorSel) return;
    const names = await dcColorOptionsFor(typeSel.value);
    const keep = colorSel.value;
    colorSel.innerHTML = names.length
      ? names.map(n => `<option value="${n}">${n}</option>`).join('')
      : '<option value="">No colours captured for this type yet</option>';
    if (names.includes(keep)) colorSel.value = keep;
  }

  function designCanvasShell(id, t) {
    document.getElementById('editor').innerHTML = `
      <button class="small" id="dc-back" style="margin-bottom:14px">← Back to templates</button>
      <h2 style="margin:0 0 4px">${t.name} <span class="canvas-hint">${t.width_mm}×${t.height_mm}mm</span></h2>
      <p class="style-note">Drag the graphic to move it, drag a corner to resize. Grid lines every 10mm. Click "✏️ Draw zone" below to trace a crystal-material zone instead — no crystal is actually rendered yet, this only records geometry and material assignment for a later compositing phase.</p>
      <div class="editor-grid">
        <div>
          <div class="canvas-wrap"><div id="dc-canvas-wrap"></div></div>
          <div id="dc-svg-status" class="preview-hint"></div>
          <div id="dc-warning" class="preview-hint" style="color:var(--danger)"></div>
        </div>
        <div>

            </label>
            <p class="help">Drawn stretched over the whole photo, then scaled/offset by the numbers below — dial them in by eye until the outline sits on the coaster's real edge. Saved per-template so it's remembered next time.</p>
            <label>Scale (%)</label>
            <input type="text" id="dc-svg-scale" value="100">
            <label>Offset X (mm)</label>
            <input type="text" id="dc-svg-offx" value="0">
            <label>Offset Y (mm)</label>
            <input type="text" id="dc-svg-offy" value="0">
            <label>Overlay opacity (%)</label>
            <input type="text" id="dc-svg-opacity" value="50">
            <p class="help">Some SVG exports embed a full reference image alongside the traced path, not just a thin outline — turn this down to see the actual product photo underneath while aligning.</p>
            <button class="small" id="dc-svg-save-align">Save alignment</button>
            <div class="preview-hint" id="dc-svg-align-status" style="margin-top:6px"></div>
          </div>
          <div class="panel">
            <label>Graphic to position</label>
            <div class="drop-zone" id="dc-graphic-zone" style="padding:20px;margin-bottom:14px">Click or drag a PNG/JPG here</div>
            <label style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px">
              <input type="checkbox" id="dc-aspect-lock" checked style="width:auto;margin:0"> Lock aspect ratio while resizing
            </label>
            <label style="margin-top:10px">Graphic opacity (%)</label>
            <input type="text" id="dc-graphic-opacity" value="100">
            <div class="actions" style="margin-top:10px">
              <button class="small primary" id="dc-graphic-save">💾 Save graphic</button>
            </div>
            <p class="help">Position, size and the image itself are lost on refresh until you save — they weren't persisted at first, which broke zone-drawing (and Redraw) on a return visit with no graphic loaded.</p>
            <div class="preview-hint" id="dc-graphic-save-status" style="margin-top:2px"></div>
          </div>
          <div class="panel">
            <label style="display:flex;align-items:center;justify-content:space-between">
              Crystal zones (workstream 2)
              <button class="small" id="dc-zone-draw-toggle" disabled>✏️ Draw zone</button>
            </label>
            <p class="help" id="dc-zone-hint">Upload a graphic above first — zones are drawn with it visible as a reference, so you can trace around where it actually sits rather than guessing blind.</p>
            <label>Zone name</label>
            <input type="text" id="dc-zone-name" placeholder="e.g. Logo area">
            <label>Crystal type</label>
            <select id="dc-zone-type">
              <option value="fabric_1.0">Crystal Fabric 1.0mm</option>
              <option value="fine_rock_1.5" selected>Crystal Fine Rock 1.5mm</option>
              <option value="rock_2.0">Crystal Rock 2.0mm</option>
            </select>
            <label>Crystal colour</label>
            <select id="dc-zone-color"><option value="">Loading…</option></select>
            <div class="actions">
              <button class="small" id="dc-zone-add-hole" disabled>🕳 Finish boundary, start a hole</button>
              <button class="small primary" id="dc-zone-finish" disabled>Finish zone (need 3+ points)</button>
            </div>
            <p class="help" id="dc-zone-ring-status"></p>
            <div class="actions" style="margin-top:6px">
              <button class="small" id="dc-zone-add-background" disabled>Add background zone (everything else)</button>
            </div>
            <div class="actions" style="margin-top:6px" id="dc-zone-edit-material-row">
              <button class="small primary" id="dc-zone-save-material" style="display:none">💾 Save material change</button>
              <button class="small" id="dc-zone-cancel-edit" style="display:none">Cancel</button>
            </div>
            <p class="help">Hollow logos/text: trace the OUTER edge first, click "Finish boundary, start a hole", then trace the INNER edge (e.g. inside a letter O) — repeat for more holes, then Finish zone. "Add background" fills the rest of the canvas around every zone drawn so far, holes included. Per zone below: ✎ changes its crystal type/colour without redrawing; ↺ deletes it and reopens drawing with the same name/material pre-filled, so a shape mistake is a quick redraw, not starting over.</p>
            <div id="dc-zone-list" style="margin-top:12px"></div>
            <div class="actions" style="margin-top:10px">
              <button class="small" id="dc-zones-save">Save zones (${(t.zones || []).length}/5)</button>
            </div>
            <div class="preview-hint" id="dc-zones-status" style="margin-top:6px"></div>
          </div>
          <div class="panel" id="dc-readout">
            <label>Placed size (real mm)</label>
            <div class="canvas-hint" id="dc-size-readout">No graphic placed yet.</div>
          </div>
          <div class="actions">
            <button class="small" id="dc-undo">↩ Undo</button>
            <button class="small" id="dc-redo">↪ Redo</button>
          </div>
        </div>
      </div>`;
    document.getElementById('dc-back').addEventListener('click', templatesShell);
    document.getElementById('dc-undo').addEventListener('click', dcApplyUndo);
    document.getElementById('dc-redo').addEventListener('click', dcApplyRedo);
    document.getElementById('dc-graphic-zone').addEventListener('click', () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg';
      inp.onchange = e => dcLoadGraphic(e.target.files[0]);
      inp.click();
    });
    document.getElementById('dc-graphic-zone').addEventListener('dragover', e => e.preventDefault());
    document.getElementById('dc-graphic-zone').addEventListener('drop', e => {
      e.preventDefault(); if (e.dataTransfer.files[0]) dcLoadGraphic(e.dataTransfer.files[0]);
    });
    document.getElementById('dc-show-svg').addEventListener('change', dcDrawCanvas);
    ['dc-svg-scale', 'dc-svg-offx', 'dc-svg-offy', 'dc-svg-opacity'].forEach(id => {
      document.getElementById(id).addEventListener('input', dcOnAlignInput);
    });
    document.getElementById('dc-svg-save-align').addEventListener('click', () => dcSaveAlignment(id));
    document.getElementById('dc-graphic-opacity').addEventListener('input', dcOnGraphicOpacityInput);
    document.getElementById('dc-graphic-save').addEventListener('click', () => dcSaveGraphicPosition(id));

    dcZoneMode = false; dcCurrentZoneRings = []; dcCurrentRingPoints = [];
    // Back-compat: zones saved before hole support (rings[]) only had a
    // flat `points` array — treat that as a single-ring (no-hole) zone
    // rather than losing anything already saved.
    dcZones = (t.zones || []).map(z => ({ ...z, rings: z.rings || (z.points ? [z.points] : []) }));
    document.getElementById('dc-zone-draw-toggle').addEventListener('click', dcToggleZoneMode);
    document.getElementById('dc-zone-type').addEventListener('change', dcRefreshZoneColorSelect);
    document.getElementById('dc-zone-add-hole').addEventListener('click', dcAddHoleRing);
    document.getElementById('dc-zone-finish').addEventListener('click', dcFinishZone);
    document.getElementById('dc-zone-add-background').addEventListener('click', dcAddBackgroundZone);
    document.getElementById('dc-zone-save-material').addEventListener('click', dcSaveMaterialEdit);
    document.getElementById('dc-zone-cancel-edit').addEventListener('click', dcCancelEditMaterial);
    document.getElementById('dc-zones-save').addEventListener('click', () => dcSaveZones(id));
    dcEditingZoneIndex = null;
    dcRefreshZoneColorSelect();
    dcRenderZoneList();

    // Alignment (scale % + mm offset + overlay opacity) persists per
    // template — see templates.py's save_template()/save_alignment().
    // Defaults to 100%/0/0/50% for a template that's never been aligned.
    document.getElementById('dc-svg-scale').value = String((t.svg_scale ?? 1) * 100);
    document.getElementById('dc-svg-offx').value = String(t.svg_offset_x_mm ?? 0);
    document.getElementById('dc-svg-offy').value = String(t.svg_offset_y_mm ?? 0);
    document.getElementById('dc-svg-opacity').value = String((t.svg_opacity ?? 0.5) * 100);

    dcUndo = []; dcRedo = [];
    const bg = new Image();
    bg.onload = () => {
      dcState = {
        tmpl: t, bgImg: bg, img: null, svgImg: null,
        xMM: t.width_mm / 2, yMM: t.height_mm / 2, wMM: 0, hMM: 0, aspect: 1, imgOpacity: 1,
        svgScale: t.svg_scale ?? 1, svgOffXMM: t.svg_offset_x_mm ?? 0, svgOffYMM: t.svg_offset_y_mm ?? 0,
        svgOpacity: t.svg_opacity ?? 0.5,
      };
      dcDrawCanvas();
      // Loaded separately from the background so a broken/missing SVG never
      // blocks the photo from showing — same-origin fetch of app.py's
      // /templates/svg/{filename} (image/svg+xml), rasterizable via <img>
      // like any other image source.
      const svg = new Image();
      svg.onload = () => { dcState.svgImg = svg; dcDrawCanvas(); };
      svg.onerror = () => {
        const el = document.getElementById('dc-svg-status');
        if (el) el.textContent = '⚠ Could not load the saved SVG for preview.';
      };
      svg.src = t.svg_url;

      // Restore a previously-saved graphic, same as the SVG above — was
      // session-only before, which silently broke zone-drawing (and
      // Redraw) on any return visit. No graphic saved yet -> nothing to do.
      if (t.graphic) {
        const gimg = new Image();
        gimg.onload = () => {
          dcState.img = gimg;
          dcState.aspect = gimg.naturalWidth / gimg.naturalHeight;
          dcState.xMM = t.graphic.x_mm; dcState.yMM = t.graphic.y_mm;
          dcState.wMM = t.graphic.w_mm; dcState.hMM = t.graphic.h_mm;
          dcState.imgOpacity = t.graphic.opacity ?? 1;
          document.getElementById('dc-graphic-opacity').value = String((t.graphic.opacity ?? 1) * 100);
          dcEnableZoneDrawing();
          dcDrawCanvas();
        };
        gimg.src = t.graphic.url;
      }
    };
    bg.src = t.photo_url;
  }

  function dcOnAlignInput() {
    if (!dcState) return;
    const scalePct = parseFloat(document.getElementById('dc-svg-scale').value);
    const offX = parseFloat(document.getElementById('dc-svg-offx').value);
    const offY = parseFloat(document.getElementById('dc-svg-offy').value);
    const opacityPct = parseFloat(document.getElementById('dc-svg-opacity').value);
    dcState.svgScale = Number.isFinite(scalePct) && scalePct > 0 ? scalePct / 100 : dcState.svgScale;
    dcState.svgOffXMM = Number.isFinite(offX) ? offX : dcState.svgOffXMM;
    dcState.svgOffYMM = Number.isFinite(offY) ? offY : dcState.svgOffYMM;
    dcState.svgOpacity = Number.isFinite(opacityPct) ? Math.max(0, Math.min(100, opacityPct)) / 100 : dcState.svgOpacity;
    dcDrawCanvas();
  }

  // Separate from dcOnAlignInput/dcSaveAlignment — the placed graphic isn't
  // persisted anywhere in this phase (see designCanvasShell's comment), so
  // its opacity is view-only, not saved with the template like the SVG's.
  function dcOnGraphicOpacityInput() {
    if (!dcState) return;
    const pct = parseFloat(document.getElementById('dc-graphic-opacity').value);
    dcState.imgOpacity = Number.isFinite(pct) ? Math.max(0, Math.min(100, pct)) / 100 : dcState.imgOpacity;
    dcDrawCanvas();
  }

  function dcToggleZoneMode() {
    if (!dcState?.img) return;
    dcSetZoneMode(!dcZoneMode);
  }

  // Split out from dcToggleZoneMode so dcRedrawZone can force zone mode ON
  // even with no graphic loaded this session — Redraw is fixing a zone
  // that already exists, it shouldn't be blocked by the (now much rarer,
  // since the graphic persists) case of no reference image being present.
  function dcSetZoneMode(on) {
    dcZoneMode = on;
    dcCurrentZoneRings = []; dcCurrentRingPoints = [];
    const btn = document.getElementById('dc-zone-draw-toggle');
    if (btn) { btn.disabled = false; btn.textContent = dcZoneMode ? '✕ Stop drawing' : '✏️ Draw zone'; btn.classList.toggle('active-toggle', dcZoneMode); }
    dcUpdateZoneDrawButtons();
    dcDrawCanvas();
  }

  // Enables/labels the "finish boundary / add hole" and "finish zone"
  // buttons based on how much of the current zone has been traced.
  function dcUpdateZoneDrawButtons() {
    const holeBtn = document.getElementById('dc-zone-add-hole');
    const finishBtn = document.getElementById('dc-zone-finish');
    const status = document.getElementById('dc-zone-ring-status');
    const canCloseCurrentRing = dcCurrentRingPoints.length >= 3;
    if (holeBtn) {
      holeBtn.disabled = !canCloseCurrentRing;
      holeBtn.textContent = dcCurrentZoneRings.length === 0
        ? '🕳 Finish boundary, start a hole' : '🕳 Finish this hole, start another';
    }
    if (finishBtn) {
      const ringsReady = dcCurrentZoneRings.length + (canCloseCurrentRing ? 1 : 0);
      finishBtn.disabled = ringsReady === 0;
      finishBtn.textContent = ringsReady === 0 ? 'Finish zone (need 3+ points)' : `Finish zone (${ringsReady} ring${ringsReady > 1 ? 's' : ''})`;
    }
    if (status) {
      status.textContent = dcCurrentZoneRings.length === 0 && dcCurrentRingPoints.length === 0
        ? '' : `Boundary${dcCurrentZoneRings.length > 1 ? ' + ' + (dcCurrentZoneRings.length - 1) + ' hole(s)' : ''} drawn so far${canCloseCurrentRing ? ` — ${dcCurrentRingPoints.length} points in the current ring` : ''}.`;
    }
  }

  // Locks the ring being clicked right now into dcCurrentZoneRings and
  // starts a fresh, empty one — used both for "finish outer boundary,
  // start a hole" and "finish this hole, start another".
  function dcAddHoleRing() {
    if (dcCurrentRingPoints.length < 3) return;
    dcCurrentZoneRings.push(dcCurrentRingPoints);
    dcCurrentRingPoints = [];
    dcUpdateZoneDrawButtons();
    dcDrawCanvas();
  }

  function dcFinishZone() {
    dcCancelEditMaterial();
    const rings = dcCurrentZoneRings.slice();
    if (dcCurrentRingPoints.length >= 3) rings.push(dcCurrentRingPoints);
    if (rings.length === 0 || dcZones.length >= 5) return;
    const name = document.getElementById('dc-zone-name').value.trim() || `Zone ${dcZones.length + 1}`;
    const crystal_type = document.getElementById('dc-zone-type').value;
    const color = document.getElementById('dc-zone-color').value;
    if (!color) { alert('Pick a crystal colour first.'); return; }
    dcZones.push({ name, crystal_type, color, rings });
    dcCurrentZoneRings = []; dcCurrentRingPoints = [];
    document.getElementById('dc-zone-name').value = '';
    dcUpdateZoneDrawButtons();
    dcRenderZoneList();
    dcDrawCanvas();
  }

  // "Add background zone" — same shape data as any other zone, just
  // computed instead of clicked: outer ring is the full template canvas,
  // and every OTHER zone's own rings (its outer boundary AND its holes)
  // become rings here too. Filled even-odd, a point's insideness toggles
  // once per ring boundary crossed — so a zone's hole ring appears twice
  // in the full picture (once as that zone's own hole, once here in the
  // background's ring list), and the two togglings cancel out exactly
  // where physical reality says they should: the hole is exposed
  // background material, not empty space and not double-counted crystal.
  // No new geometry math, just reusing the same ring list twice.
  function dcAddBackgroundZone() {
    dcCancelEditMaterial();
    if (!dcState || dcZones.length === 0 || dcZones.length >= 5) return;
    const name = document.getElementById('dc-zone-name').value.trim() || 'Background';
    const crystal_type = document.getElementById('dc-zone-type').value;
    const color = document.getElementById('dc-zone-color').value;
    if (!color) { alert('Pick a crystal colour first.'); return; }
    const w = dcState.tmpl.width_mm, h = dcState.tmpl.height_mm;
    const canvasRing = [{ x_mm: 0, y_mm: 0 }, { x_mm: w, y_mm: 0 }, { x_mm: w, y_mm: h }, { x_mm: 0, y_mm: h }];
    const rings = [canvasRing, ...dcZones.flatMap(z => z.rings)];
    dcZones.push({ name, crystal_type, color, rings });
    document.getElementById('dc-zone-name').value = '';
    dcRenderZoneList();
    dcDrawCanvas();
  }

  function dcRemoveZone(i) {
    dcZones.splice(i, 1);
    dcRenderZoneList();
    dcDrawCanvas();
  }

  function dcRenderZoneList() {
    const list = document.getElementById('dc-zone-list');
    const saveBtn = document.getElementById('dc-zones-save');
    const bgBtn = document.getElementById('dc-zone-add-background');
    if (saveBtn) saveBtn.textContent = `Save zones (${dcZones.length}/5)`;
    if (bgBtn) bgBtn.disabled = dcZones.length === 0 || dcZones.length >= 5;
    if (!list) return;
    if (dcZones.length === 0) { list.innerHTML = '<p class="canvas-hint">No zones drawn yet.</p>'; return; }
    list.innerHTML = dcZones.map((z, i) => {
      const ringDesc = z.rings.length > 1 ? `${z.rings.length - 1} hole${z.rings.length > 2 ? 's' : ''}` : 'no holes';
      return `
      <div class="swatch-row" style="cursor:default">
        <div class="dot" style="background:${ZONE_COLORS[i % ZONE_COLORS.length]}"></div>
        <div class="name">${z.name}<br><span class="canvas-hint">${z.crystal_type} · ${z.color} · ${ringDesc}</span></div>
        <button class="small" data-zone-edit="${i}" title="Edit crystal type/colour">✎</button>
        <button class="small" data-zone-redraw="${i}" title="Delete and redraw with the same name/material">↺</button>
        <button class="small danger" data-zone-remove="${i}">✕</button>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-zone-remove]').forEach(btn => {
      btn.addEventListener('click', () => dcRemoveZone(Number(btn.dataset.zoneRemove)));
    });
    list.querySelectorAll('[data-zone-edit]').forEach(btn => {
      btn.addEventListener('click', () => dcStartEditMaterial(Number(btn.dataset.zoneEdit)));
    });
    list.querySelectorAll('[data-zone-redraw]').forEach(btn => {
      btn.addEventListener('click', () => dcRedrawZone(Number(btn.dataset.zoneRedraw)));
    });
  }

  // ── Edit an existing zone's material (type/colour) without redrawing ────
  let dcEditingZoneIndex = null;

  async function dcStartEditMaterial(i) {
    dcEditingZoneIndex = i;
    const z = dcZones[i];
    document.getElementById('dc-zone-name').value = z.name;
    document.getElementById('dc-zone-type').value = z.crystal_type;
    await dcRefreshZoneColorSelect();
    document.getElementById('dc-zone-color').value = z.color;
    document.getElementById('dc-zone-save-material').style.display = '';
    document.getElementById('dc-zone-cancel-edit').style.display = '';
  }

  function dcCancelEditMaterial() {
    // No-op unless an edit is actually in progress — dcFinishZone() and
    // dcAddBackgroundZone() call this defensively to clear stale edit
    // state, and must NOT wipe the name field the admin just typed for a
    // brand-new zone in the process.
    if (dcEditingZoneIndex === null) return;
    dcEditingZoneIndex = null;
    document.getElementById('dc-zone-name').value = '';
    document.getElementById('dc-zone-save-material').style.display = 'none';
    document.getElementById('dc-zone-cancel-edit').style.display = 'none';
  }

  function dcSaveMaterialEdit() {
    if (dcEditingZoneIndex === null) return;
    const name = document.getElementById('dc-zone-name').value.trim() || dcZones[dcEditingZoneIndex].name;
    const crystal_type = document.getElementById('dc-zone-type').value;
    const color = document.getElementById('dc-zone-color').value;
    if (!color) { alert('Pick a crystal colour first.'); return; }
    dcZones[dcEditingZoneIndex] = { ...dcZones[dcEditingZoneIndex], name, crystal_type, color };
    dcCancelEditMaterial();
    dcRenderZoneList();
    dcDrawCanvas();
  }

  // ── Delete a zone and reopen drawing with the same name/material,
  // rather than making the admin retype everything to fix a shape mistake.
  function dcRedrawZone(i) {
    const z = dcZones[i];
    dcZones.splice(i, 1);
    document.getElementById('dc-zone-name').value = z.name;
    document.getElementById('dc-zone-type').value = z.crystal_type;
    dcRefreshZoneColorSelect().then(() => { document.getElementById('dc-zone-color').value = z.color; });
    dcRenderZoneList();
    if (!dcZoneMode) dcSetZoneMode(true);
    dcDrawCanvas();
  }

  async function dcSaveZones(templateId) {
    const status = document.getElementById('dc-zones-status');
    const res = await fetch(`/templates/${encodeURIComponent(templateId)}/zones`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zones: dcZones }),
    });
    if (!res.ok) { if (status) status.textContent = '⚠ ' + ((await res.json()).detail || 'Save failed'); return; }
    if (status) status.textContent = '✓ Zones saved.';
  }

  async function dcSaveAlignment(templateId) {
    if (!dcState) return;
    const fd = new FormData();
    fd.append('scale', dcState.svgScale);
    fd.append('offset_x_mm', dcState.svgOffXMM);
    fd.append('offset_y_mm', dcState.svgOffYMM);
    fd.append('opacity', dcState.svgOpacity);
    const status = document.getElementById('dc-svg-align-status');
    const res = await fetch(`/templates/${encodeURIComponent(templateId)}/align`, { method: 'POST', body: fd });
    if (!res.ok) { if (status) status.textContent = '⚠ ' + ((await res.json()).detail || 'Save failed'); return; }
    if (status) status.textContent = '✓ Alignment saved.';
  }

  function dcLoadGraphic(file) {
    if (!file || !dcState) return;
    dcGraphicFile = file;
    const img = new Image();
    img.onload = () => {
      dcState.img = img;
      dcState.aspect = img.naturalWidth / img.naturalHeight;
      // Default: 30% of the template's width, aspect-preserved, centred.
      dcState.wMM = dcState.tmpl.width_mm * 0.3;
      dcState.hMM = dcState.wMM / dcState.aspect;
      dcState.xMM = (dcState.tmpl.width_mm - dcState.wMM) / 2;
      dcState.yMM = (dcState.tmpl.height_mm - dcState.hMM) / 2;
      dcUndo = []; dcRedo = [];
      dcEnableZoneDrawing();
      dcDrawCanvas();
    };
    img.src = URL.createObjectURL(file);
  }

  // Shared by a fresh upload and by loading a previously-saved graphic on
  // template open — both end with a usable dcState.img, so both should
  // unlock zone-drawing the same way.
  function dcEnableZoneDrawing() {
    const zoneBtn = document.getElementById('dc-zone-draw-toggle');
    const zoneHint = document.getElementById('dc-zone-hint');
    if (zoneBtn) zoneBtn.disabled = false;
    if (zoneHint) zoneHint.textContent = 'Click points on the photo to trace a zone (min 3), then Finish. While drawing, the graphic can\'t be dragged — click "Draw zone" again to stop and go back to positioning the graphic.';
  }

  async function dcSaveGraphicPosition(templateId) {
    if (!dcState?.img) return;
    const status = document.getElementById('dc-graphic-save-status');
    const fd = new FormData();
    fd.append('x_mm', dcState.xMM); fd.append('y_mm', dcState.yMM);
    fd.append('w_mm', dcState.wMM); fd.append('h_mm', dcState.hMM);
    fd.append('opacity', dcState.imgOpacity ?? 1);
    if (dcGraphicFile) fd.append('image', dcGraphicFile);
    const res = await fetch(`/templates/${encodeURIComponent(templateId)}/graphic`, { method: 'POST', body: fd });
    if (!res.ok) { if (status) status.textContent = '⚠ ' + ((await res.json()).detail || 'Save failed'); return; }
    dcGraphicFile = null; // now persisted server-side — next save doesn't need to re-upload it
    if (status) status.textContent = '✓ Graphic saved — stays after a refresh now.';
  }

  function dcSnapshot() {
    return { xMM: dcState.xMM, yMM: dcState.yMM, wMM: dcState.wMM, hMM: dcState.hMM };
  }
  function dcPushUndo() { dcUndo.push(dcSnapshot()); dcRedo = []; }
  function dcApplyUndo() {
    if (!dcUndo.length || !dcState) return;
    dcRedo.push(dcSnapshot());
    Object.assign(dcState, dcUndo.pop());
    dcDrawCanvas();
  }
  function dcApplyRedo() {
    if (!dcRedo.length || !dcState) return;
    dcUndo.push(dcSnapshot());
    Object.assign(dcState, dcRedo.pop());
    dcDrawCanvas();
  }

  const DC_HANDLE_PX = 9;

  function dcDrawCanvas() {
    const wrap = document.getElementById('dc-canvas-wrap');
    if (!wrap || !dcState) return;
    const maxW = 640;
    const dispW = Math.min(maxW, dcState.bgImg.naturalWidth);
    const dispH = Math.round(dispW * (dcState.bgImg.naturalHeight / dcState.bgImg.naturalWidth));
    const pxPerMM = dispW / dcState.tmpl.width_mm;
    dcState.dispW = dispW; dcState.dispH = dispH; dcState.pxPerMM = pxPerMM;

    let canvas = wrap.querySelector('canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      wrap.appendChild(canvas);
      canvas.addEventListener('mousedown', dcOnMouseDown);
      if (!dcWindowListenersBound) {
        window.addEventListener('mousemove', dcOnMouseMove);
        window.addEventListener('mouseup', dcOnMouseUp);
        dcWindowListenersBound = true;
      }
    }
    canvas.width = dispW; canvas.height = dispH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(dcState.bgImg, 0, 0, dispW, dispH);

    // SVG outline overlay — base size is the full photo (still assuming the
    // SVG's own canvas was traced 1:1 against it), then manually scaled and
    // mm-offset by the admin's alignment controls until it visually sits on
    // the real product edge. Anchored at the photo's centre so scaling
    // grows/shrinks symmetrically rather than drifting toward one corner.
    // Persisted per template (svg_scale/svg_offset_x_mm/svg_offset_y_mm) —
    // see templates.py's save_alignment(). Shown at reduced opacity,
    // whatever colour the SVG itself was authored with.
    const showSvg = document.getElementById('dc-show-svg')?.checked;
    if (showSvg && dcState.svgImg) {
      const scale = dcState.svgScale ?? 1;
      const offXpx = (dcState.svgOffXMM ?? 0) * pxPerMM;
      const offYpx = (dcState.svgOffYMM ?? 0) * pxPerMM;
      const w = dispW * scale, h = dispH * scale;
      const x = (dispW - w) / 2 + offXpx, y = (dispH - h) / 2 + offYpx;
      ctx.save();
      ctx.globalAlpha = dcState.svgOpacity ?? 0.5;
      ctx.drawImage(dcState.svgImg, x, y, w, h);
      ctx.restore();
    }

    // Grid every 10mm, labelled every 50mm.
    ctx.strokeStyle = 'rgba(198,166,100,0.25)';
    ctx.fillStyle = 'rgba(198,166,100,0.6)';
    ctx.font = '9px monospace';
    ctx.lineWidth = 1;
    for (let mm = 0; mm * pxPerMM < dispW; mm += 10) {
      const x = mm * pxPerMM;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, dispH); ctx.stroke();
      if (mm % 50 === 0 && mm > 0) ctx.fillText(`${mm}`, x + 2, 10);
    }
    for (let mm = 0; mm * pxPerMM < dispH; mm += 10) {
      const y = mm * pxPerMM;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(dispW, y); ctx.stroke();
      if (mm % 50 === 0 && mm > 0) ctx.fillText(`${mm}`, 2, y - 2);
    }

    // Adds every ring of a zone as one continuous path (multiple subpaths,
    // one per ring) so a single fill('evenodd') call handles holes
    // correctly — canvas 2D's even-odd rule toggles "insideness" once per
    // ring boundary crossed, independent of draw order or which ring is
    // "the hole"; it just needs all rings in one path.
    function pathForRings(rings) {
      rings.forEach(ring => {
        ring.forEach((p, j) => {
          const x = p.x_mm * pxPerMM, y = p.y_mm * pxPerMM;
          if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
      });
    }

    // Completed zones — translucent even-odd fill + outline per ring, one
    // colour per slot (cycled), name labelled at the outer ring's first
    // vertex. Geometry only, no crystal material is actually rendered here
    // — that's later compositing work; this is the authoring surface.
    dcZones.forEach((z, i) => {
      const col = ZONE_COLORS[i % ZONE_COLORS.length];
      ctx.beginPath();
      pathForRings(z.rings);
      ctx.fillStyle = col + '55'; ctx.fill('evenodd');
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      const p0 = z.rings[0][0];
      ctx.fillStyle = col; ctx.font = 'bold 11px monospace';
      ctx.fillText(z.name, p0.x_mm * pxPerMM + 4, p0.y_mm * pxPerMM - 4);
    });

    // In-progress zone (while dcZoneMode is on) — completed rings so far
    // (e.g. a finished outer boundary while a hole is being clicked) get
    // the same even-odd fill preview; the ring currently being clicked is
    // drawn as plain dashed lines + point markers since it isn't closed yet.
    if (dcZoneMode) {
      if (dcCurrentZoneRings.length) {
        ctx.beginPath();
        pathForRings(dcCurrentZoneRings);
        ctx.fillStyle = '#ffffff33'; ctx.fill('evenodd');
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
      }
      if (dcCurrentRingPoints.length) {
        ctx.beginPath();
        dcCurrentRingPoints.forEach((p, j) => {
          const x = p.x_mm * pxPerMM, y = p.y_mm * pxPerMM;
          if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
        dcCurrentRingPoints.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x_mm * pxPerMM, p.y_mm * pxPerMM, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.fill();
        });
      }
    }

    if (dcState.img) {
      const gx = dcState.xMM * pxPerMM, gy = dcState.yMM * pxPerMM;
      const gw = dcState.wMM * pxPerMM, gh = dcState.hMM * pxPerMM;
      ctx.save();
      ctx.globalAlpha = dcState.imgOpacity ?? 1;
      ctx.drawImage(dcState.img, gx, gy, gw, gh);
      ctx.restore();
      ctx.strokeStyle = '#c6a664'; ctx.lineWidth = 1.5;
      ctx.strokeRect(gx, gy, gw, gh);
      ctx.fillStyle = '#c6a664';
      [[gx, gy], [gx + gw, gy], [gx, gy + gh], [gx + gw, gy + gh]].forEach(([hx, hy]) => {
        ctx.fillRect(hx - DC_HANDLE_PX / 2, hy - DC_HANDLE_PX / 2, DC_HANDLE_PX, DC_HANDLE_PX);
      });

      const readout = document.getElementById('dc-size-readout');
      if (readout) readout.textContent = `${dcState.wMM.toFixed(1)} × ${dcState.hMM.toFixed(1)} mm, at (${dcState.xMM.toFixed(1)}, ${dcState.yMM.toFixed(1)}) mm from top-left`;
      const warn = document.getElementById('dc-warning');
      if (warn) {
        warn.textContent = (dcState.wMM < MIN_FEATURE_MM || dcState.hMM < MIN_FEATURE_MM)
          ? `⚠ Placed very small (under ${MIN_FEATURE_MM}mm on one side) — fine detail likely won't survive as crystal fabric (min bead size ~1mm). This is a size check only, not real stroke-width detection inside the artwork.`
          : '';
      }
    }
  }

  function dcHandleAt(px, py) {
    if (!dcState?.img) return null;
    const { pxPerMM, xMM, yMM, wMM, hMM } = dcState;
    const gx = xMM * pxPerMM, gy = yMM * pxPerMM, gw = wMM * pxPerMM, gh = hMM * pxPerMM;
    const corners = { nw: [gx, gy], ne: [gx + gw, gy], sw: [gx, gy + gh], se: [gx + gw, gy + gh] };
    for (const [name, [hx, hy]] of Object.entries(corners)) {
      if (Math.abs(px - hx) <= DC_HANDLE_PX && Math.abs(py - hy) <= DC_HANDLE_PX) return name;
    }
    if (px >= gx && px <= gx + gw && py >= gy && py <= gy + gh) return 'body';
    return null;
  }

  // canvas has `max-width:100%` (global CSS), so its on-screen CSS size can
  // be smaller than its internal pixel resolution (canvas.width/height) —
  // client coords must be scaled back into canvas-pixel space, same as the
  // swatch editor's toCanvasXY() does in drawCanvas(). Missing this made
  // resize handles miss (tolerance too small to survive the scale error)
  // while drag-to-move still worked, since its hit region is much bigger.
  function dcToCanvasXY(e, canvas) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (canvas.width / r.width),
      y: (e.clientY - r.top) * (canvas.height / r.height),
    };
  }

  function dcOnMouseDown(e) {
    if (!dcState) return;
    const { x: px, y: py } = dcToCanvasXY(e, e.target);
    if (dcZoneMode) {
      let x_mm = px / dcState.pxPerMM, y_mm = py / dcState.pxPerMM;
      // Snap the closing click onto the ring's first point instead of
      // wherever the mouse actually landed — owner: "i usually mess up for
      // the last closing dot which i either went pass it so that the
      // shape looks weird." A near-miss click no longer leaves a stray
      // sliver; within ~10 canvas px of the first point counts as "back
      // at the start."
      if (dcCurrentRingPoints.length >= 3) {
        const p0 = dcCurrentRingPoints[0];
        const dx = px - p0.x_mm * dcState.pxPerMM, dy = py - p0.y_mm * dcState.pxPerMM;
        if (Math.sqrt(dx * dx + dy * dy) <= 10) { x_mm = p0.x_mm; y_mm = p0.y_mm; }
      }
      dcCurrentRingPoints.push({ x_mm, y_mm });
      dcUpdateZoneDrawButtons();
      dcDrawCanvas();
      return;
    }
    if (!dcState.img) return;
    const hit = dcHandleAt(px, py);
    if (!hit) return;
    dcPushUndo();
    dcDrag = {
      mode: hit === 'body' ? 'move' : 'resize', handle: hit,
      startPX: px, startPY: py, orig: dcSnapshot(),
    };
  }

  function dcOnMouseMove(e) {
    if (!dcDrag || !dcState) return;
    const canvas = document.querySelector('#dc-canvas-wrap canvas');
    if (!canvas) return;
    const { x: px, y: py } = dcToCanvasXY(e, canvas);
    const dMM_x = (px - dcDrag.startPX) / dcState.pxPerMM;
    const dMM_y = (py - dcDrag.startPY) / dcState.pxPerMM;
    const o = dcDrag.orig;

    if (dcDrag.mode === 'move') {
      dcState.xMM = o.xMM + dMM_x;
      dcState.yMM = o.yMM + dMM_y;
    } else {
      const lock = document.getElementById('dc-aspect-lock')?.checked;
      let { xMM, yMM, wMM, hMM } = o;
      if (dcDrag.handle === 'se') { wMM = o.wMM + dMM_x; hMM = lock ? wMM / dcState.aspect : o.hMM + dMM_y; }
      else if (dcDrag.handle === 'nw') { wMM = o.wMM - dMM_x; hMM = lock ? wMM / dcState.aspect : o.hMM - dMM_y; xMM = o.xMM + o.wMM - wMM; yMM = o.yMM + o.hMM - hMM; }
      else if (dcDrag.handle === 'ne') { wMM = o.wMM + dMM_x; hMM = lock ? wMM / dcState.aspect : o.hMM - dMM_y; yMM = o.yMM + o.hMM - hMM; }
      else if (dcDrag.handle === 'sw') { wMM = o.wMM - dMM_x; hMM = lock ? wMM / dcState.aspect : o.hMM + dMM_y; xMM = o.xMM + o.wMM - wMM; }
      if (wMM > 2 && hMM > 2) { dcState.wMM = wMM; dcState.hMM = hMM; dcState.xMM = xMM; dcState.yMM = yMM; }
    }
    dcDrawCanvas();
  }

  function dcOnMouseUp() {
    if (!dcDrag) return;
    // If nothing actually moved, the pushed undo entry is a no-op waste —
    // harmless (undo would just restore the same values) but pop it anyway
    // to keep the undo stack meaningful.
    const now = dcSnapshot(), before = dcDrag.orig;
    if (JSON.stringify(now) === JSON.stringify(before)) dcUndo.pop();
    dcDrag = null;
  }

  document.getElementById('add-new').addEventListener('click', addNew);
  document.getElementById('test-render').addEventListener('click', testRenderShell);
  document.getElementById('templates-nav').addEventListener('click', templatesShell);
  AUTH_TEST.then(loadSwatches).catch(() => {
    document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#c1553f">Sign-in required or ADMIN_PASSWORD not configured.</div>';
  });
</script>
</body>
</html>
